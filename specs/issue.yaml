schema_version: 1
last_reviewed: 2026-09-02
issue_task:
  syntax: issue
  purpose:
    - resolve one existing open GitHub issue end-to-end
  selection_rules:
    - use .agent/scripts/agent-pick-issue.sh to inspect the live open issue list and choose work
    - ignore issue #22 (Dependency Dashboard); it is a standing automation tracker and must never be selected
    - if one or more remaining open issues are labeled bug and it is simple to determine which one is oldest, choose the oldest open bug
    - if no remaining open bug issues exist and it is simple to determine which remaining open issue is oldest, choose the oldest open issue
    - if ordering is ambiguous, expensive to determine, or otherwise not simple, choose any open issue and proceed
    - if there are no eligible open issues after excluding issue #22, state that explicitly and stop
  process:
    - inspect the selected issue body, labels, linked context, and relevant local code before editing
    - when creating an ordinary GitHub issue, apply the most specific existing type label that matches the issue, such as bug or enhancement; do not invent new labels
    - when creating or relabeling issues, add the migration label to work that exists to preserve end-user compatibility across otherwise breaking changes
    - when creating a new GitHub issue through gh, use a create-once-then-verify flow: if the create attempt returns ambiguous output or fails unclearly, verify first whether the issue already exists before considering any retry
    - load task-relevant files under specs/ based on the issue scope before making changes
    - before committing, review the issue acceptance criteria and explicitly account for the normal flow, expected user mistakes, malformed or unavailable external state, and security or persistence invariants
    - if an acceptance criterion cannot be expressed as an automated assertion, explain why and obtain maintainer direction before shipping
    - implement the fix, add focused tests, and run the minimum validation required by specs/delivery.yaml
    - update matching files under specs/ if the change affects behavior, architecture, security, persistence, configuration, or delivery guidance
    - when the resolving commit closes the selected issue, add a Closes #<issue-number> footer line to the commit message
    - once the work is suitable for release, commit it, run git pull -r on the current branch, push it, and close the resolved issue according to AGENTS.md
  escalation_rules:
    - if the selected issue requires an important behavior, architecture, persistence, configuration, security, or wording decision that is not already answered by the project documents, return to the maintainer before deciding
    - if resolving the issue would require a fallback behavior the maintainer did not ask for, pause and ask
    - if resolving the issue would require changing persistence formats, cryptographic parameters, or user-visible security defaults, pause and ask
  github_cli_usage:
    prefer_gh_when:
      - listing and selecting open issues
      - reading issue bodies, labels, comments, and linked context
      - commenting on or closing the resolved issue
    preferred_commands:
      - .agent/scripts/agent-pick-issue.sh
      - gh issue list
      - gh issue view
      - gh issue comment
      - gh issue close
    safeguards:
      - never retry gh issue create before checking whether the earlier attempt already created the intended issue
      - when issue creation output is ambiguous, search the live issue list by title and context before deciding that creation failed
