schema_version: 1
last_reviewed: 2026-11-11
agent_internal_scripts:
  location: .agent/scripts
  purpose:
    - keep deterministic multi-step agent workflows out of manual command choreography
    - make fresh-context agents discover and reuse the same local task helpers
  scripts:
    - name: agent-context.sh
      use_for: printing the spec files required for a task route
    - name: agent-pick-issue.sh
      use_for: selecting the eligible GitHub issue for the issue task
    - name: agent-validate.sh
      use_for: previewing or running the validation sequence for a known change type
    - name: agent-ship.sh
      use_for: formatting, staging exact paths, committing, rebase-pulling, and pushing releasable work
    - name: agent-review-preflight.sh
      use_for: gathering deterministic review-area context and GitHub triage state
    - name: agent-review-finding.sh
      use_for: creating or updating GitHub issues for actionable review findings
    - name: check-agent-specs.sh
      use_for: checking that agent instructions, specs, hooks, and helper scripts are wired consistently
    - name: agent-release-artifact-check.sh
      use_for: running the release jar manifest and payload verification sequence
quality_gates:
  tool_preparation:
    - mise.toml pins Java, Node, Python, actionlint, Gitleaks and ShellCheck for local validation
    - run mise install and mise run prepare explicitly before offline Git hooks; preparation does not run validation
    - use mise exec for manual Please Behave and Git commands without shell activation so hooks inherit the configured tool PATH
    - Git, Bash, desktop support, the published governor and credentials remain external prerequisites
  formatting_and_style:
    - run ./gradlew ktlintFormat before staging, committing, or pushing to auto-resolve formatting issues when possible
    - pre-commit hook runs ./gradlew ktlintCheck
    - pre-commit hook runs ./gradlew detekt
    - pre-commit hook runs ./gradlew compileKotlin
    - pre-commit hook runs ./gradlew compileTestKotlin
    - pre-commit hook verifies .agent/scripts and specification wiring
  warning_enforcement:
    - Kotlin compilation treats warnings as errors across main and test sources
    - Gradle deprecations are monitored through build output and CI logs, but they do not fail the build by default because third-party plugins may emit warnings outside repository control
  test_suites:
    - ./gradlew test
    - ./gradlew property
    - ./gradlew mutation
    - ./gradlew integration
    - ./gradlew architecture
    - ./gradlew allTests
  coverage:
    command: ./gradlew jacocoTestCoverageVerification
    thresholds:
      instruction: ">= 0.90"
      branch: ">= 0.85"
  dependency_and_license:
    - Gradle Wrapper pins the distribution URL and official SHA-256 checksum in gradle/wrapper/gradle-wrapper.properties
    - pre-push hook runs ./gradlew checkLicense
    - the dependency-license Rule intentionally runs ./gradlew --offline --no-configuration-cache --no-build-cache --rerun-tasks checkLicense because dependency-license-report tasks retain Gradle Project state and otherwise force configuration-cache discard at the end of the hook run
    - Gradle dependency verification uses gradle/verification-metadata.xml and the armored gradle/verification-keyring.keys file
    - GitHub Actions OWASP dependency check workflows
  dependency_maintenance:
    - Renovate groups the semantic-release changelog toolchain so its preset and writer update together
    - Renovate dependency dashboard stays enabled for pending and grouped dependency work
    - Renovate standard dependency updates require a 7-day minimum release age before branch or pull-request creation
    - the shared external renovate-governor preset updates .please-version to stable published Please Behave releases, including major versions, without a cooldown and auto-merges after green CI
    - Renovate GitHub Actions updates and major-version updates require a 14-day minimum release age
    - Renovate internal checks use strict filtering so updates blocked by minimum release age stay visible through the dashboard without early branch or pull-request creation
    - Renovate auto-merges patch, minor, and digest updates through GitHub once required CI checks succeed
    - Renovate keeps other non-GitHub-Actions major-version updates manual even after CI succeeds
    - Renovate GitHub Actions updates auto-merge after green CI regardless of whether the update is major, minor, or patch
    - repository renovate.json config refreshes gradle/verification-metadata.xml and gradle/verification-keyring.keys as a post-upgrade task for Gradle-related updates
  convenience_task:
    - ./gradlew preCommitCheck
    - ./gradlew prePushCheck
  hook_managed_checks:
    - the managed pre-commit wrapper runs please run --at pre-commit
    - the managed pre-push wrapper runs please run --at pre-push
local_verification_policy:
  pre_commit_hook:
    covers:
      - ./gradlew ktlintCheck
      - ./gradlew detekt
      - ./gradlew compileKotlin
      - ./gradlew compileTestKotlin
    note: do not rerun these manually before commit unless the maintainer explicitly asks for it or a non-hook reason makes the duplicate run necessary
  pre_push_hook:
    covers:
      - ./gradlew checkLicense
      - ./gradlew jacocoTestCoverageVerification
      - ./gradlew allTests
      - ./gradlew jar
      - ./smoke-test/run.sh
    note: do not rerun these manually; the governor also runs shared security/license checks, workflow validation and offline release-helper tests
  focused_tests:
    default: run only tests that exercise the code you changed or the tests you added
    coverage_expectation:
      - add or update focused tests so every new code path and important branch introduced by the change is reasonably covered before shipping
      - do not rely on unchanged repository-wide coverage headroom to carry insufficiently tested new code
    behavioral_test_design:
      before_implementation:
        - identify the changed happy path, expected failure modes, and security or persistence invariants
        - choose the lowest test level that can prove each behavior; use integration tests for adapter, filesystem, crypto, archive, and prompt boundaries
      required_coverage:
        - each changed happy path has at least one explicit outcome assertion
        - each new conditional has tests for every meaningful outcome
        - validate credible user-input errors, malformed external data, I/O failures, authentication failures, conflicts, and empty-input behavior when relevant
        - persistence and exchange changes verify round-trip fidelity, invalid-input rejection, and that sensitive temporary artifacts are not left behind
        - secret-handling changes verify secrets are requested through the intended secure path and are not exposed in output, logs, or returned diagnostics
      assertion_quality:
        - assert observable behavior, not implementation detail alone
        - name tests after the business or safety guarantee they prove
        - a generic operation-failed assertion is acceptable only when the contract intentionally exposes no more detail; otherwise assert the specific rejection or outcome
      prohibited:
        - do not add unreachable or duplicate tests merely to raise a coverage percentage
        - do not replace a missing behavior test with broad mocking or an aggregate coverage argument
    avoid_repetition:
      - do not rerun the same local verification during one task unless the code or environment changed in a way that makes the repeated run materially informative
      - do not poll or narrate long-running Gradle tasks or git hooks unnecessarily; a multi-minute runtime is expected for some local gates
    expand_scope_when:
      - a structural or wiring change needs ./gradlew architecture
      - the maintainer explicitly asks for broader local verification
    long_running_tasks:
      - allow Gradle tasks and git hooks to run for at least 5 minutes before checking status
      - after the first status check on a long-running task, do not check again more than once every 5 minutes
  owasp_dependency_check:
    local_runs: discouraged
    default: rely_on_ci
    note: only run locally when the maintainer explicitly asks for it
    scan_scope:
      - Gradle runtimeClasspath and the existing src/main/resources and src/main/webapp resource roots
      - generated .dependency-check database files are ignored by Git and excluded from source snapshots; tracked source coverage is unchanged
      - repository-local npm release tooling is not part of the shipped JVM runtime scan
    suppressions:
      - keep `owasp-suppressions.xml` limited to confirmed false positives, verified unreachable runtime findings, or verified build-time-only findings that do not affect shipped runtime artifacts
  dependency_verification:
    files:
      - gradle/wrapper/gradle-wrapper.properties
      - gradle/verification-metadata.xml
      - gradle/verification-keyring.keys
    maintenance:
      - when the Gradle Wrapper distribution changes, update distributionUrl and distributionSha256Sum together using the official Gradle distribution checksum
      - when third-party dependencies or Gradle plugins change, refresh with ./gradlew --refresh-keys --write-verification-metadata sha256,pgp --export-keys compileKotlin compileTestKotlin compileJava compileTestJava
      - prefer resolving the same compile tasks CI uses so verification metadata captures test artifacts as well
      - if key downloads still fail after refreshing keys, review any newly generated checksum fallback entries carefully before committing them
      - keep the armored keyring in version control and do not commit the generated gradle/verification-keyring.gpg file
  ci_landscape:
    github:
      workflows:
        - .github/workflows/coverage-badges.yml
        - .github/workflows/ci.yml
        - .github/workflows/codeql.yml
        - .github/workflows/owasp-update.yml
        - .github/workflows/owasp-purge.yml
        - .github/workflows/release.yml
    notes:
      - ci.yml uses check / Check with the published governor, preserving main pushes, Renovate PRs and manual dispatch
      - CI, Readiness and Candidate execute through SHA-pinned Please Behave Action v1.2.0 with checks-only and Job Summaries enabled; the CLI pin remains .please-version
      - CI prepares Xvfb before source checks; release runtime matrix jobs use xvfb-run for candidate smoke tests
      - preparation downloads locked dependencies and prepares tools before checks; governed tests remain offline with synthetic credentials and mocked services
      - preparation explicitly resolves runtime POM artifacts for offline license discovery; license report tasks bypass the build cache and rerun to reject stale incomplete reports
      - preparation resolves the native task graph online with --dry-run to cache signature metadata before offline checks without executing build or test tasks
      - agent-spec validation uses portable Python directly on both macOS and Linux; the zsh helper remains an optional local entrypoint
      - allTests covers unit, property, integration, architecture and desktop clipboard tests in one Rule; CI prepares Xvfb, xauth and xclip
      - coverage consumes nonempty allTests.exec only and retains 90 percent instruction and 85 percent branch thresholds plus HTML/XML diagnostics
      - native test diagnostics are consolidated into test-reports; lint, Detekt, license, OWASP, mutation and smoke diagnostics remain available after failures
      - CI builds one source/run/attempt-bound release-jar for payload comparison; Release Candidate builds the versioned JAR once and tests it on a Java 17/21/25 matrix with fail-fast disabled
      - PIT is the mutation Rule in the same Check invocation with unchanged high-risk targets, target tests, timeouts and report/line-coverage outputs
      - OWASP is a blocking Rule at check with the existing secret names and cache prefix; neither OWASP nor mutation runs in local hooks or again at release-readiness; explicit manual check runs both
      - daily OWASP refresh and weekly purge/rebuild retain manual dispatch and the shared maintenance lock; maintenance and analysis disable configuration caching
      - CodeQL keeps security-extended queries and the nightly Kotlin toolchain
      - coverage-badges.yml repeats coverage independently and owns all badge files, artifact transfer and complete Jekyll documentation/coverage Pages publication
      - badge endpoints, SVG and JSON formats, rounding, colors, HTML report and thresholds remain unchanged
      - Pages retains coverage-pages concurrency, cancel-in-progress false and queue max; ordering follows queue arrival
      - actionlint 1.7.12 supports timezone; a separately tested checker validates queue values before suppressing only its unknown-queue diagnostic
      - release.yml retains Monday 03:23 Europe/Berlin stable releases, manual development prereleases and the existing preview entrypoints
      - Plan does not prepare or publish; Readiness and Candidate build run in parallel; Publish requires both and the complete candidate runtime matrix
      - Candidate builds with the planned version and checks exact JAR bytes on Java 25, 17 and 21; Publish never rebuilds
      - readiness requires trusted exact-source push CI and propagates the external proof's retained Check attempt for CI artifact binding
      - artifacts, metadata, checksums and smoke receipts bind version, source, repository and workflow run/attempt; incomplete or foreign sets fail
      - partial CI reruns may retain successful jobs; Release reruns require the current attempt's complete candidate
      - monthly development-release purge retains its 30-day policy and tag cleanup
github_cli_usage:
  when_remote_state_matters:
    - inspect local workflow YAML first for static behavior, then use gh for live GitHub-side workflow registration, runs, jobs, and logs
    - use gh for GitHub-hosted artifacts such as issues, pull requests, releases, and repository metadata instead of browser-only interaction when auditability or automation matters
  preferred_commands:
    - gh workflow view
    - gh run list
    - gh run view
    - gh issue list
    - gh issue view
    - gh issue create
    - gh pr view
    - gh release view
  tooling_preference:
    - prefer rtk gh for supported subcommands and use direct gh for unsupported subcommands such as gh workflow or gh release
change_rules:
  - keep changes small and intention-revealing in this security-sensitive codebase
  - add or update tests with behavior changes; do not rely on docs alone
  - treat reasonable automated coverage for all newly introduced code paths and important branches as mandatory for releasable work
  - never suppress detekt or ktlint findings in source code; fix the code or adjust the shared tool configuration instead
  - update README for user-visible command, workflow, or migration changes
  - update CONFIGURATION.md for any configuration-schema or default-value change
  - update specs docs whenever agent-facing guidance would otherwise become stale
  - update AGENTS.md and matching specs when adding, renaming, or changing deterministic helper workflows under .agent/scripts
  - preserve backward compatibility unless the maintainer explicitly chooses a breaking change
  - use .agent/scripts/agent-ship.sh for the deterministic format, stage, commit, pull --rebase, and push sequence when shipping completed releasable work
  - delay commit and push only when maintainer input is still required or the current state is incomplete or not ready to release
  - work directly on main; do not create, switch to, or push any other local or remote branch
  - do not use git stash; if main-only work is blocked by unrelated workspace state or another git constraint, stop and wait for maintainer instructions
commit_messages:
  standard: conventional_commits
  enforced_by:
    - external Conventional Commits Check imported by .please/config.toml
  supported_types:
    - fix
    - feat
    - build
    - chore
    - ci
    - docs
    - perf
    - refactor
    - revert
    - style
    - test
    - config
  optional_scopes:
    - build
    - clipboard
    - config
    - deps
    - exchange
    - favorites
    - memory
    - nests
    - passwords
    - proteins
    - release
    - security
    - session
    - storage
    - ui
    - yolks
  guidance:
    - use scopes for localized product features or technical areas
    - session covers startup and inactivity
    - storage covers password-tree persistence and backups
    - security covers encryption and keystore handling
    - build covers build tooling
    - documentation, tests and CI use their commit types with an optional feature scope
    - omit the scope for broad or cross-cutting changes
    - prefer scope-less ci commits unless a scoped ci commit is clearly more readable
recommended_validation_by_change_type:
  docs_only:
    run:
      - review changed files for consistency
      - .agent/scripts/check-agent-specs.sh when agent instructions, specs, hooks, or helper scripts changed
  kotlin_code_non_structural:
    run:
      - .agent/scripts/agent-validate.sh kotlin_code_non_structural -- focused Gradle args chosen by the agent
      - run only the focused tests for the changed code or newly added tests
  architecture_or_wiring:
    run:
      - .agent/scripts/agent-validate.sh architecture_or_wiring -- focused Gradle args chosen by the agent
      - run only the focused tests for the changed code or newly added tests
      - ./gradlew architecture
  config_or_user_workflow:
    run:
      - .agent/scripts/agent-validate.sh config_or_user_workflow -- focused Gradle args chosen by the agent
      - run only the focused unit, property, and integration tests that cover the changed workflow
  ci_or_release_workflow:
    run:
      - review workflow, release config and artifact binding against .please/README.md
      - use targeted offline helper tests for diagnosis; final full validation belongs to Git hooks
      - .agent/scripts/agent-release-artifact-check.sh verifies an already built JAR without rebuilding
      - inspect GitHub metadata with gh when remote facts matter, without triggering Release
  security_or_persistence:
    run:
      - .agent/scripts/agent-validate.sh security_or_persistence -- focused Gradle args chosen by the agent
      - run the focused persistence or workflow tests you changed or added
      - ./gradlew architecture
      - review CI OWASP coverage instead of running dependency-check locally
  jar_or_terminal_smoke:
    run:
      - .agent/scripts/agent-validate.sh jar_or_terminal_smoke
      - ./gradlew jar
      - ./smoke-test/run.sh
    notes:
      - use when the maintainer explicitly asks to validate the built passbird.jar end to end through its interactive terminal flow
      - smoke-test/run.sh is also part of the governor pre-push gate; do not repeat it manually before Git
release_and_history_notes:
  versioning: stable 7.x semantic versioning
  contract: .please/README.md
  automation:
    - stable tags remain plain versions; development tags have dev- and visible/JAR versions omit that prefix
    - feat releases minor; fix, perf, chore, refactor, build and effective revert release patch; breaking changes release major
    - test, ci, config, docs and style do not release unless breaking; historical major commits remain major
    - scoped reverts cancel unreleased originals in analysis and notes; historical build(release) version commits are ignored
    - no generated version commit is created
    - release assets retain passbird.jar for stable and opt-in development updater compatibility and add SHA256SUMS and metadata.json
    - Build-Date, Created-By, executable entrypoint, vendor/title and implementation/specification version attributes remain intact
  release_guardrail:
    - persistence or migration changes must be documented before release
    - missing or mismatched manifests, unsafe JAR entries, incomplete smoke evidence and foreign source/version/run/attempt metadata fail before publication
    - Publish compares candidate payload with the trusted CI JAR allowing only manifest differences and never rebuilds
    - publication rechecks planned version, checkout source and unchanged remote main
    - tag, GitHub release and asset publication are not atomic; partial failures must be reported
    - agents do not publish releases, trigger Release or monitor remote workflows without explicit authorization
escalation_rules:
  - escalate when a change has hidden compatibility risk for stored data
  - escalate when a request conflicts with offline-only posture
  - escalate when a test-only green state would still leave the security model ambiguous
review_protocol:
  trigger: review <area>
  supported_areas:
    - security
    - architecture
    - integrity
    - behavior
    - delivery
  requirements:
    - workspace reviews must use the current concern as a trigger but evaluate the full workspace
    - findings must be reported as P0 to P3 and ordered by severity
    - every finding must include a proposed fix
    - every unique actionable finding must be tracked in GitHub with the Review Finding issue template and referenced in the review output
    - search existing GitHub issues with gh before creating a new review-finding issue, and update an existing issue instead of duplicating it when it already captures the finding
    - explicitly state when a selected review area has no actionable findings
