schema_version: 1
last_reviewed: 2026-05-24
quality_gates:
  formatting_and_style:
    - run ./gradlew ktlintFormat before staging, committing, or pushing to auto-resolve formatting issues when possible
    - pre-commit hook runs ./gradlew ktlintCheck
    - pre-commit hook runs ./gradlew detekt
  warning_enforcement:
    - Kotlin compilation treats warnings as errors across main and test sources
    - Gradle deprecations are monitored through build output and CI logs, but they do not fail the build by default because third-party plugins may emit warnings outside repository control
  test_suites:
    - ./gradlew test
    - ./gradlew property
    - ./gradlew mutation
    - ./gradlew integration
    - ./gradlew architecture
    - ./gradlew allTests
  coverage:
    command: ./gradlew jacocoTestCoverageVerification
    thresholds:
      instruction: ">= 0.90"
      branch: ">= 0.85"
  dependency_and_license:
    - pre-commit hook runs ./gradlew checkLicense
    - Gradle dependency verification uses gradle/verification-metadata.xml and the armored gradle/verification-keyring.keys file
    - GitHub Actions OWASP dependency check workflows
  convenience_task:
    - ./gradlew preCommitCheck
  hook_managed_checks:
    - the generated .git/hooks/pre-commit script runs ./gradlew --no-build-cache clean jar before smoke-test/run.sh
    - the generated .git/hooks/pre-commit script removes build/smoke-test-pre-commit before each smoke run for a clean interactive workspace
    - the generated .git/hooks/pre-commit script then runs ./gradlew preCommitCheck
local_verification_policy:
  pre_commit_hook:
    covers:
      - ./gradlew --no-build-cache clean jar
      - ./smoke-test/run.sh
      - ./gradlew ktlintCheck
      - ./gradlew detekt
      - ./gradlew checkLicense
      - ./gradlew jacocoTestCoverageVerification
      - ./gradlew allTests
    note: do not rerun these manually unless the maintainer explicitly asks for it; preCommitCheck alone does not include the hook-only clean jar build and smoke pass
  focused_tests:
    default: run only tests that exercise the code you changed or the tests you added
    expand_scope_when:
      - a structural or wiring change needs ./gradlew architecture
      - the maintainer explicitly asks for broader local verification
  owasp_dependency_check:
    local_runs: discouraged
    default: rely_on_ci
    note: only run locally when the maintainer explicitly asks for it
  dependency_verification:
    files:
      - gradle/verification-metadata.xml
      - gradle/verification-keyring.keys
    maintenance:
      - when third-party dependencies or Gradle plugins change, refresh with ./gradlew --write-verification-metadata sha256,pgp --export-keys help
      - retry with ./gradlew --refresh-keys help if key downloads fail before accepting new ignored-key entries
      - review checksum fallback and ignored-key additions before committing them
      - keep the armored keyring in version control and do not commit the generated gradle/verification-keyring.gpg file
ci_landscape:
  github:
    workflows:
      - .github/workflows/build.yml
      - .github/workflows/codeql.yml
      - .github/workflows/owasp-update.yml
      - .github/workflows/owasp-purge.yml
      - .github/workflows/publish.yml
    notes:
      - ordinary branch pushes only prove the always-on compile, lint, static-analysis, license, OWASP, and non-conditional test jobs; they skip architecture-tests, test-coverage-verification, test-coverage-report, pages-site, and deploy-pages
      - architecture tests and coverage jobs run only on pull requests and direct pushes to main, while GitHub Pages publication stays main-only
      - the build workflow runs dependency-check analysis on push and restores its local database from the default-branch GitHub Actions cache when available
      - Java-based GitHub Actions workflows run on Temurin 25 LTS while the Gradle build still targets Java 17 bytecode for released artifacts
      - the build workflow runs detekt as a dedicated static-analysis job and uploads its reports as artifacts
      - jqwik failure databases and PIT mutation reports are uploaded as workflow artifacts so falsified samples, seeds, and mutation context remain inspectable after CI failures
      - a daily OWASP workflow refreshes the dependency-check cache from the Gradle plugin update task
      - a weekly OWASP workflow purges and rebuilds the dependency-check cache during the Sunday-to-Monday overnight window
      - the CodeQL workflow runs the broader built-in security-extended query suite while staying on the nightly toolchain for Kotlin compatibility
      - CodeQL intentionally uses the nightly toolchain because stable CodeQL can lag behind current Kotlin support, and this repository prefers not to delay Kotlin upgrades for that gap
      - the GitHub Pages site builds from a temporary Jekyll source assembled in the workflow from repository documentation plus workflow-owned Pages config under .github/pages so the product root stays free of Pages-only files
      - the build workflow publishes the GitHub Pages site for coverage assets and refreshes the branch-coverage badge, instruction-coverage badge, and report on main
      - publish workflow creates manual GitHub prereleases from the latest official stable base version and runs semantic-release only on the Monday 03:00 Europe/Berlin schedule, but only after the current main commit already has a successful Build and Verify workflow run
      - scheduled stable publish runs are expected to succeed even when no release is due, while manual publish runs are expected to produce a new development prerelease
github_cli_usage:
  when_remote_state_matters:
    - inspect local workflow YAML first for static behavior, then use gh for live GitHub-side workflow registration, runs, jobs, and logs
    - use gh for GitHub-hosted artifacts such as issues, pull requests, releases, and repository metadata instead of browser-only interaction when auditability or automation matters
  preferred_commands:
    - gh workflow view
    - gh run list
    - gh run view
    - gh issue list
    - gh issue view
    - gh issue create
    - gh pr view
    - gh release view
  tooling_preference:
    - prefer rtk gh for supported subcommands and use direct gh for unsupported subcommands such as gh workflow or gh release
change_rules:
  - keep changes small and intention-revealing in this security-sensitive codebase
  - add or update tests with behavior changes; do not rely on docs alone
  - never suppress detekt or ktlint findings in source code; fix the code or adjust the shared tool configuration instead
  - update README for user-visible command, workflow, or migration changes
  - update CONFIGURATION.md for any configuration-schema or default-value change
  - update specs docs whenever agent-facing guidance would otherwise become stale
  - preserve backward compatibility unless the maintainer explicitly chooses a breaking change
  - run ./gradlew ktlintFormat before staging, committing, or pushing to auto-resolve formatting issues when possible
  - commit and, before pushing, run git pull -r on the current branch, then push immediately after a task is complete and releasable
  - delay commit and push only when maintainer input is still required or the current state is incomplete or not ready to release
commit_messages:
  standard: conventional_commits
  enforced_by:
    - local commit-msg hook generated from settings.gradle.kts
  supported_types:
    - fix
    - feat
    - build
    - chore
    - ci
    - docs
    - perf
    - refactor
    - revert
    - style
    - test
    - major
  optional_scopes:
    - backup
    - boot
    - clipboard
    - commands
    - configuration
    - deps
    - egg
    - events
    - exchange
    - gradle
    - inactivity
    - keystore
    - memory
    - nest
    - password
    - passwordtree
    - protein
    - release
    - security
    - userinterface
  guidance:
    - use scopes for localized software changes, especially adapter-focused work
    - omit the scope for broad or cross-cutting changes
    - prefer scope-less ci commits unless a scoped ci commit is clearly more readable
recommended_validation_by_change_type:
  docs_only:
    run:
      - review changed files for consistency
  kotlin_code_non_structural:
    run:
      - run only the focused tests for the changed code or newly added tests
  architecture_or_wiring:
    run:
      - run only the focused tests for the changed code or newly added tests
      - ./gradlew architecture
  config_or_user_workflow:
    run:
      - run only the focused unit, property, and integration tests that cover the changed workflow
  ci_or_release_workflow:
    run:
      - ./gradlew jar
      - review workflow and release config for consistency
      - inspect relevant GitHub Actions runs or workflow metadata with gh when the question depends on GitHub-side state
      - run semantic-release in dry-run mode when credentials and tags are available for scheduled stable-release behavior
  security_or_persistence:
    run:
      - run the focused persistence or workflow tests you changed or added
      - ./gradlew architecture
      - review CI OWASP coverage instead of running dependency-check locally
  jar_or_terminal_smoke:
    run:
      - ./gradlew jar
      - ./smoke-test/run.sh
    notes:
      - use when the maintainer explicitly asks to validate the built passbird.jar end to end through its interactive terminal flow
      - treat smoke-test/run.sh as complementary manual verification rather than a replacement for focused Gradle tests
release_and_history_notes:
  versioning: semantic versioning
  commit_patterns_observed:
    - conventional commit style for automation and release tooling
    - dependency updates are frequent and usually automated
  automation:
    - semantic-release now publishes scheduled stable releases on GitHub rather than GitLab
    - manual publish runs create GitHub prereleases whose tags are prefixed with dev- while their visible versions remain updater-compatible
    - release assets are expected to include passbird.jar for updater compatibility on both stable and development channels
  release_guardrail:
    - if a change impacts persistence format or migration behavior, document it before release
    - agents should not push partial or unreleasable states simply to satisfy the default commit-and-push rule
escalation_rules:
  - escalate when a change has hidden compatibility risk for stored data
  - escalate when a request conflicts with offline-only posture
  - escalate when a test-only green state would still leave the security model ambiguous
review_protocol:
  trigger: review <area>
  supported_areas:
    - security
    - architecture
    - integrity
    - behavior
    - delivery
  requirements:
    - workspace reviews must use the current concern as a trigger but evaluate the full workspace
    - findings must be reported as P0 to P3 and ordered by severity
    - every finding must include a proposed fix
    - every unique actionable finding must be tracked in GitHub with the Review Finding issue template and referenced in the review output
    - search existing GitHub issues with gh before creating a new review-finding issue, and update an existing issue instead of duplicating it when it already captures the finding
    - explicitly state when a selected review area has no actionable findings
