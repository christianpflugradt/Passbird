schema_version: 1
last_reviewed: 2026-06-07
agent_internal_scripts:
  location: .agent/scripts
  purpose:
    - keep deterministic multi-step agent workflows out of manual command choreography
    - make fresh-context agents discover and reuse the same local task helpers
  scripts:
    - name: agent-context.sh
      use_for: printing the spec files required for a task route
    - name: agent-pick-issue.sh
      use_for: selecting the eligible GitHub issue for the issue task
    - name: agent-validate.sh
      use_for: previewing or running the validation sequence for a known change type
    - name: agent-ship.sh
      use_for: formatting, staging exact paths, committing, rebase-pulling, and pushing releasable work
    - name: agent-review-preflight.sh
      use_for: gathering deterministic review-area context and GitHub triage state
    - name: agent-review-finding.sh
      use_for: creating or updating GitHub issues for actionable review findings
    - name: check-agent-specs.sh
      use_for: checking that agent instructions, specs, hooks, and helper scripts are wired consistently
    - name: agent-release-artifact-check.sh
      use_for: running the release jar manifest and payload verification sequence
quality_gates:
  formatting_and_style:
    - run ./gradlew ktlintFormat before staging, committing, or pushing to auto-resolve formatting issues when possible
    - pre-commit hook runs ./gradlew ktlintCheck
    - pre-commit hook runs ./gradlew detekt
    - pre-commit hook runs ./gradlew compileKotlin
    - pre-commit hook runs ./gradlew compileTestKotlin
  warning_enforcement:
    - Kotlin compilation treats warnings as errors across main and test sources
    - Gradle deprecations are monitored through build output and CI logs, but they do not fail the build by default because third-party plugins may emit warnings outside repository control
  test_suites:
    - ./gradlew test
    - ./gradlew property
    - ./gradlew mutation
    - ./gradlew integration
    - ./gradlew architecture
    - ./gradlew allTests
  coverage:
    command: ./gradlew jacocoTestCoverageVerification
    thresholds:
      instruction: ">= 0.90"
      branch: ">= 0.85"
  dependency_and_license:
    - Gradle Wrapper pins the distribution URL and official SHA-256 checksum in gradle/wrapper/gradle-wrapper.properties
    - pre-push hook runs ./gradlew checkLicense
    - Gradle dependency verification uses gradle/verification-metadata.xml and the armored gradle/verification-keyring.keys file
    - GitHub Actions OWASP dependency check workflows
  dependency_maintenance:
    - Renovate dependency dashboard stays enabled for pending and grouped dependency work
    - Renovate standard dependency updates require a 7-day minimum release age before branch or pull-request creation
    - Renovate GitHub Actions updates and major-version updates require a 14-day minimum release age
    - Renovate internal checks use strict filtering so updates blocked by minimum release age stay visible through the dashboard without early branch or pull-request creation
    - repository renovate.json config refreshes gradle/verification-metadata.xml and gradle/verification-keyring.keys as a post-upgrade task for Gradle-related updates
  convenience_task:
    - ./gradlew preCommitCheck
    - ./gradlew prePushCheck
  hook_managed_checks:
    - the generated .git/hooks/pre-commit script runs ./gradlew preCommitCheck
    - the generated .git/hooks/pre-push script runs ./gradlew prePushCheck
local_verification_policy:
  pre_commit_hook:
    covers:
      - ./gradlew ktlintCheck
      - ./gradlew detekt
      - ./gradlew compileKotlin
      - ./gradlew compileTestKotlin
    note: do not rerun these manually unless the maintainer explicitly asks for it
  pre_push_hook:
    covers:
      - ./gradlew checkLicense
      - ./gradlew jacocoTestCoverageVerification
      - ./gradlew allTests
      - ./gradlew jar
      - ./smoke-test/run.sh
    note: do not rerun these manually unless the maintainer explicitly asks for it; prePushCheck includes the hook-managed jar build and smoke pass
  focused_tests:
    default: run only tests that exercise the code you changed or the tests you added
    expand_scope_when:
      - a structural or wiring change needs ./gradlew architecture
      - the maintainer explicitly asks for broader local verification
  owasp_dependency_check:
    local_runs: discouraged
    default: rely_on_ci
    note: only run locally when the maintainer explicitly asks for it
    suppressions:
      - keep `owasp-suppressions.xml` limited to confirmed false positives, verified unreachable runtime findings, or verified build-time-only findings that do not affect shipped runtime artifacts
  dependency_verification:
    files:
      - gradle/wrapper/gradle-wrapper.properties
      - gradle/verification-metadata.xml
      - gradle/verification-keyring.keys
    maintenance:
      - when the Gradle Wrapper distribution changes, update distributionUrl and distributionSha256Sum together using the official Gradle distribution checksum
      - when third-party dependencies or Gradle plugins change, refresh with ./gradlew --write-verification-metadata sha256,pgp --export-keys help
      - retry with ./gradlew --refresh-keys help if key downloads fail before accepting new ignored-key entries
      - review checksum fallback and ignored-key additions before committing them
      - keep the armored keyring in version control and do not commit the generated gradle/verification-keyring.gpg file
  ci_landscape:
    github:
      workflows:
        - .github/workflows/build.yml
        - .github/workflows/codeql.yml
        - .github/workflows/owasp-update.yml
        - .github/workflows/owasp-purge.yml
        - .github/workflows/publish.yml
    notes:
      - ordinary branch pushes prove the always-on compile, lint, static-analysis, license, OWASP, LTS jar-smoke matrix, and non-conditional test jobs; they skip architecture-tests, test-coverage-verification, test-coverage-report, pages-site, and deploy-pages
      - the build workflow installs Xvfb and xclip, builds the releasable passbird.jar once with the GitHub Actions manifest metadata on Temurin 25 LTS, and runs smoke-test/run.sh against that same artifact under xvfb-run on Java 17, 21, and 25
      - architecture tests and coverage jobs run only on pull requests and direct pushes to main, while GitHub Pages publication stays main-only
      - the build workflow runs dependency-check analysis on push and restores its local database from the default-branch GitHub Actions cache when available
      - single-run Java-based GitHub Actions workflow jobs use Temurin 25 LTS while the Gradle build enforces a Java 17 API floor for compilation and the build workflow proves runtime compatibility for the current LTS line
      - the build workflow runs detekt as a dedicated static-analysis job and uploads its reports as artifacts
      - unit, integration, property, architecture, and PIT mutation diagnostic artifacts are uploaded when present even after their owning test steps fail, so test reports, generated-test failures, and mutation context remain inspectable after CI failures
      - a daily OWASP workflow refreshes the dependency-check cache from the Gradle plugin update task
      - a weekly OWASP workflow purges and rebuilds the dependency-check cache during the Sunday-to-Monday overnight window
      - the CodeQL workflow runs the broader built-in security-extended query suite while staying on the nightly toolchain for Kotlin compatibility
      - CodeQL intentionally uses the nightly toolchain because stable CodeQL can lag behind current Kotlin support, and this repository prefers not to delay Kotlin upgrades for that gap
      - the GitHub Pages site builds from a temporary Jekyll source assembled in the workflow from repository documentation plus workflow-owned Pages config under .github/pages so the product root stays free of Pages-only files
      - the build workflow publishes the GitHub Pages site for coverage assets and refreshes the branch-coverage badge, instruction-coverage badge, and report on main
      - publish workflow creates manual GitHub prereleases from the latest official stable base version and runs semantic-release only on the Monday 03:00 Europe/Berlin schedule, but only after the current main commit already has a Build and Verify workflow run with the release-jar artifact and successful artifact smoke validation jobs
      - manual publish runs compute the development release version before building passbird.jar, scheduled stable publish runs build passbird.jar during semantic-release prepare with the stable nextRelease.version, and both paths verify the jar manifest plus payload equivalence against the verified release-jar artifact before release publication
      - scheduled stable publish runs are expected to succeed even when no release is due, while manual publish runs are expected to produce a new development prerelease
github_cli_usage:
  when_remote_state_matters:
    - inspect local workflow YAML first for static behavior, then use gh for live GitHub-side workflow registration, runs, jobs, and logs
    - use gh for GitHub-hosted artifacts such as issues, pull requests, releases, and repository metadata instead of browser-only interaction when auditability or automation matters
  preferred_commands:
    - gh workflow view
    - gh run list
    - gh run view
    - gh issue list
    - gh issue view
    - gh issue create
    - gh pr view
    - gh release view
  tooling_preference:
    - prefer rtk gh for supported subcommands and use direct gh for unsupported subcommands such as gh workflow or gh release
change_rules:
  - keep changes small and intention-revealing in this security-sensitive codebase
  - add or update tests with behavior changes; do not rely on docs alone
  - never suppress detekt or ktlint findings in source code; fix the code or adjust the shared tool configuration instead
  - update README for user-visible command, workflow, or migration changes
  - update CONFIGURATION.md for any configuration-schema or default-value change
  - update specs docs whenever agent-facing guidance would otherwise become stale
  - update AGENTS.md and matching specs when adding, renaming, or changing deterministic helper workflows under .agent/scripts
  - preserve backward compatibility unless the maintainer explicitly chooses a breaking change
  - use .agent/scripts/agent-ship.sh for the deterministic format, stage, commit, pull --rebase, and push sequence when shipping completed releasable work
  - delay commit and push only when maintainer input is still required or the current state is incomplete or not ready to release
commit_messages:
  standard: conventional_commits
  enforced_by:
    - local commit-msg hook generated from settings.gradle.kts
  supported_types:
    - fix
    - feat
    - build
    - chore
    - ci
    - docs
    - perf
    - refactor
    - revert
    - style
    - test
    - major
  optional_scopes:
    - backup
    - boot
    - clipboard
    - commands
    - configuration
    - deps
    - egg
    - events
    - exchange
    - gradle
    - inactivity
    - keystore
    - memory
    - nest
    - password
    - passwordtree
    - protein
    - release
    - security
    - userinterface
  guidance:
    - use scopes for localized software changes, especially adapter-focused work
    - omit the scope for broad or cross-cutting changes
    - prefer scope-less ci commits unless a scoped ci commit is clearly more readable
recommended_validation_by_change_type:
  docs_only:
    run:
      - review changed files for consistency
      - .agent/scripts/check-agent-specs.sh when agent instructions, specs, hooks, or helper scripts changed
  kotlin_code_non_structural:
    run:
      - .agent/scripts/agent-validate.sh kotlin_code_non_structural -- focused Gradle args chosen by the agent
      - run only the focused tests for the changed code or newly added tests
  architecture_or_wiring:
    run:
      - .agent/scripts/agent-validate.sh architecture_or_wiring -- focused Gradle args chosen by the agent
      - run only the focused tests for the changed code or newly added tests
      - ./gradlew architecture
  config_or_user_workflow:
    run:
      - .agent/scripts/agent-validate.sh config_or_user_workflow -- focused Gradle args chosen by the agent
      - run only the focused unit, property, and integration tests that cover the changed workflow
  ci_or_release_workflow:
    run:
      - .agent/scripts/agent-validate.sh ci_or_release_workflow for ordinary CI workflow changes
      - .agent/scripts/agent-release-artifact-check.sh when release jar manifest stamping or artifact payload binding changes
      - ./gradlew jar
      - when release jar manifest stamping changes, build with an explicit -PreleaseVersion value and run .github/scripts/verify-release-jar-manifest.sh against build/libs/passbird.jar
      - when publish artifact binding changes, compare the rebuilt release jar with the verified release-jar artifact using .github/scripts/verify-release-jar-payload.sh
      - review workflow and release config for consistency
      - inspect relevant GitHub Actions runs or workflow metadata with gh when the question depends on GitHub-side state
      - run semantic-release in dry-run mode when credentials and tags are available for scheduled stable-release behavior
  security_or_persistence:
    run:
      - .agent/scripts/agent-validate.sh security_or_persistence -- focused Gradle args chosen by the agent
      - run the focused persistence or workflow tests you changed or added
      - ./gradlew architecture
      - review CI OWASP coverage instead of running dependency-check locally
  jar_or_terminal_smoke:
    run:
      - .agent/scripts/agent-validate.sh jar_or_terminal_smoke
      - ./gradlew jar
      - ./smoke-test/run.sh
    notes:
      - use when the maintainer explicitly asks to validate the built passbird.jar end to end through its interactive terminal flow
      - treat smoke-test/run.sh as complementary manual verification rather than a replacement for focused Gradle tests
release_and_history_notes:
  versioning: semantic versioning
  commit_patterns_observed:
    - conventional commit style for automation and release tooling
    - dependency updates are frequent and usually automated
  automation:
    - semantic-release now publishes scheduled stable releases on GitHub rather than GitLab
    - manual publish runs create GitHub prereleases whose tags are prefixed with dev- while their visible versions remain updater-compatible
    - release jars are stamped through the explicit Gradle -PreleaseVersion input; development jars use the unprefixed dev version shown in the prerelease title and stable jars use the semantic-release nextRelease.version
    - release assets are expected to include passbird.jar for updater compatibility on both stable and development channels
    - publish runs stay gated on a fully successful Build and Verify workflow for the same main commit, including the non-expired release-jar artifact and jar-level smoke validation jobs for that artifact
  release_guardrail:
    - if a change impacts persistence format or migration behavior, document it before release
    - publish workflow release paths must fail before creating or publishing a GitHub release when passbird.jar has a missing, unspecified, or mismatched Implementation-Version manifest value
    - publish workflow release paths must fail before creating or publishing a GitHub release when the version-stamped release jar payload differs from the verified release-jar artifact
    - agents should not push partial or unreleasable states simply to satisfy the default commit-and-push rule
escalation_rules:
  - escalate when a change has hidden compatibility risk for stored data
  - escalate when a request conflicts with offline-only posture
  - escalate when a test-only green state would still leave the security model ambiguous
review_protocol:
  trigger: review <area>
  supported_areas:
    - security
    - architecture
    - integrity
    - behavior
    - delivery
  requirements:
    - workspace reviews must use the current concern as a trigger but evaluate the full workspace
    - findings must be reported as P0 to P3 and ordered by severity
    - every finding must include a proposed fix
    - every unique actionable finding must be tracked in GitHub with the Review Finding issue template and referenced in the review output
    - search existing GitHub issues with gh before creating a new review-finding issue, and update an existing issue instead of duplicating it when it already captures the finding
    - explicitly state when a selected review area has no actionable findings
