schema_version: 1
last_reviewed: 2026-05-29
product_shape:
  audience:
    - individual users who want an offline terminal password manager
  primary_mode:
    - interactive local CLI started with a home directory argument
  non_goals:
    - browser integration
    - cloud sync
    - network services
    - rich GUI workflows
use_cases:
  - maintain passwords as Eggs grouped into Nests
  - reveal or copy stored secrets on demand
  - enrich an Egg with additional Protein entries such as usernames, URLs, or recovery data
  - import or export passwords through a human-readable exchange file
  - rotate the keystore master password without replacing the underlying secret
  - restore or continue using existing local state across restarts while staying offline
command_surface:
  parsing_rules:
    - commands are entered as a continuous token without separating whitespace
    - for data-carrying commands, parsing stops at the first alphabetic character after the command prefix and treats the remaining characters as data
    - examples of that parsing rule include lfilter, l*filter, pEggId, m0p0, and nEggId
  discoverability:
    top_level_help_command:
      - h is the explicit top-level help command
      - the top-level help screen presents the syntax contract as [command][parameter]
      - the top-level help screen describes commands as taking at most one parameter, usually an EggId
    top_level_help_advertised_entrypoints:
      - g[EggId]
      - s[EggId]
      - s*[EggId]
      - c[EggId]
      - v[EggId]
      - r[EggId]
      - d[EggId]
      - e
      - e*
      - i
      - i*
      - k
      - l
      - l[filter]
      - l*
      - l*[filter]
      - .
      - h
      - q
      - n
      - f?
      - m?
      - p?
      - y?
      - s?
    secondary_help_menus:
      - n displays current Nest state plus Nest-specific commands
      - f? displays Favorites-specific commands
      - m? displays Memory-specific commands
      - p? displays Protein-specific commands
      - y? displays Yolk-specific commands
      - s? displays available password configurations plus Set-specific commands
  primary_entry_commands:
    - h
    - q
    - g[EggId]
    - s[EggId]
    - s*[EggId]
    - s[1-9][EggId]
    - c[EggId]
    - v[EggId]
    - r[EggId]
    - d[EggId]
    - e
    - e*
    - i
    - i*
    - k
    - l
    - l[filter]
    - l*
    - l*[filter]
    - .
    - n
    - n0
    - n[1-9]
    - n+[1-9]
    - n-[1-9]
    - n[EggId]
    - f?
    - f
    - f[0-9]
    - f[0-9][Command...]
    - f+[0-9][EggId]
    - f-[0-9]
    - m?
    - m
    - m[0-9]
    - m[0-9][Command...]
    - p
    - p?
    - p[EggId]
    - p*[EggId]
    - p[0-9][EggId]
    - p+[EggId]
    - p+[0-9][EggId]
    - p-[0-9][EggId]
    - y?
    - y[EggId]
    - y+[EggId]
    - y-[EggId]
    - s?
capabilities:
  - name: password_entry_management
    user_outcomes:
      - create a password entry
      - replace an existing password entry
      - reveal a password
      - copy a password to the clipboard
      - rename an EggId
      - discard a password entry
    commands:
      - g[EggId]
      - s[EggId]
      - c[EggId]
      - v[EggId]
      - r[EggId]
      - d[EggId]
  - name: selective_password_generation
    user_outcomes:
      - generate passwords with default or named custom configurations
    commands:
      - s[EggId]
      - s*[EggId]
      - s[1-9][EggId]
      - s?
  - name: nest_management
    user_outcomes:
      - switch between Nest contexts
      - create and discard Nests
      - assign Eggs to Nests by entering the EggId and then choosing the target Nest interactively
    commands:
      - n
      - n0
      - n[1-9]
      - n+[1-9]
      - n-[1-9]
      - n[EggId]
  - name: protein_management
    user_outcomes:
      - inspect Protein types and structures
      - populate multiple Protein slots through a guided flow
      - create, overwrite, or discard Proteins in fixed slots
    commands:
      - p
      - p?
      - p[EggId]
      - p*[EggId]
      - p[0-9][EggId]
      - p+[EggId]
      - p+[0-9][EggId]
      - p-[0-9][EggId]
  - name: yolk_management
    user_outcomes:
      - inspect Yolk commands
      - store one TOTP secret per Egg
      - display the current TOTP code for an Egg
      - discard a stored TOTP secret
    commands:
      - y?
      - y[EggId]
      - y+[EggId]
      - y-[EggId]
  - name: favorites
    user_outcomes:
      - pin frequently used EggIds per Nest
      - list the pinned EggIds for the current Nest
      - reuse a pinned EggId without retyping it
    commands:
      - f?
      - f
      - f[0-9]
      - f[0-9][Command...]
      - f+[0-9][EggId]
      - f-[0-9]
  - name: import_export
    user_outcomes:
      - export all Eggs or selected Nests into passbird-export.json
      - import all exported Eggs or selectively restore one exported Nest into a chosen slot
    commands:
      - e
      - e*
      - i
      - i*
  - name: keystore_maintenance
    user_outcomes:
      - change the keystore master password
      - complete first-run keystore creation during setup
    commands:
      - k
  - name: help_and_session_control
    user_outcomes:
      - inspect the top-level command catalog
      - repeat the last successful non-repeat command
      - exit the interactive session explicitly
    commands:
      - .
      - h
      - q
  - name: memory_and_listing
    user_outcomes:
      - list Eggs in the current Nest or across Nests
      - reuse recently used EggIds from memory slots
    commands:
      - l
      - l[filter]
      - l*
      - l*[filter]
      - m?
      - m
      - m[0-9]
      - m[0-9][Command...]
known_surface_drifts:
  - area: protein_info_discoverability
    top_level_help_advertised_shape: p?
    actual_additional_accepted_shape: p
    actual_behavior:
      - bare p resolves to the same Protein info/help screen as p?
observable_product_rules:
  - every interactive capability is terminal-native and local-file-backed
  - commands stay terse and character-first unless the maintainer explicitly changes that direction
  - command families are part of the public product surface and should not drift from README, help output, or flow specs
  - discoverability is part of the product surface, not just parser behavior
