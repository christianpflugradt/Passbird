schema_version: 1
last_reviewed: 2026-05-30
configuration_surface:
  source_of_truth_files:
    - passbird.yml
    - CONFIGURATION.md
  fixed_runtime_filenames:
    - passbird.yml is the configuration filename resolved from the run home directory
    - passbird.sec is the keystore filename wherever adapter.keyStore.location points
    - passbird.tree is the password-tree filename wherever adapter.passwordTree.location points
    - passbird-export.json is the fixed exchange filename in the run home directory
  user_visible_defaults:
    - template configuration mode defaults to true only when passbird.yml is missing from the run home directory
    - application.backup.location defaults to backups before setup rewrites it into a concrete directory path
    - application.backup.numberOfBackups defaults to 10
    - application.backup.configuration.enabled defaults to true
    - application.backup.keyStore.enabled defaults to true
    - application.backup.passwordTree.enabled defaults to true
    - application.exchange.promptOnExportFile defaults to true
    - application.password.length defaults to 20
    - application.password.specialCharacters defaults to true
    - application.password.promptOnRemoval defaults to true
    - application.password.customPasswordConfigurations defaults to an empty list
    - application.yolk.algorithm defaults to SHA1
    - application.yolk.copyToClipboard defaults to true
    - application.yolk.digits defaults to 6
    - application.yolk.periodSeconds defaults to 30
    - adapter.userInterface.ansiEscapeCodes.enabled defaults to false
    - adapter.userInterface.audibleBell defaults to false
    - adapter.userInterface.secureInput defaults to true
    - adapter.clipboard.reset.enabled defaults to true
    - adapter.clipboard.reset.delaySeconds defaults to 10
    - adapter.passwordTree.verifySignature defaults to true
    - adapter.passwordTree.verifyChecksum defaults to true
    - application.inactivityLimit.enabled defaults to false
    - application.inactivityLimit.limitInMinutes defaults to 10
    - domain.eggIdMemory.enabled defaults to true
    - domain.eggIdMemory.persisted defaults to false
    - domain.protein.secureProteinStructureInput defaults to true
    - domain.protein.promptForProteinStructureInputToggle defaults to false
    - domain.protein.templates defaults to an empty list
  loading_behavior:
    - if passbird.yml does not exist in the run home directory, Passbird loads a template configuration instead of reporting a load failure
    - if passbird.yml exists and contains an unrecognized property, Passbird reports that the configuration contains an unrecognized property, exits with a non-zero process status, and does not fall back to template mode
    - if passbird.yml exists and cannot otherwise be parsed or loaded, Passbird reports Configuration could not be loaded: <ExceptionMessage> and exits with a non-zero process status
  setup_materialization_rules:
    - when setup persists a new configuration for chosen directory <D>, it writes passbird.yml to <D>/passbird.yml
    - when setup persists a new configuration for chosen directory <D>, application.backup.location is rewritten to <D>/backups
    - when setup persists a new configuration for chosen directory <D>, adapter.keyStore.location is rewritten to <D>
    - when setup persists a new configuration for chosen directory <D>, adapter.passwordTree.location is rewritten to <D>
    - when setup creates a keystore in chosen directory <D>, the created file path is <D>/passbird.sec
    - when setup repairs a missing keystore in chosen directory <D>, the active passbird.yml is rewritten so adapter.keyStore.location is <D> while other storage directories are preserved
areas:
  - name: startup_and_exchange
    keys:
      - application.exchange.promptOnExportFile
      - application.inactivityLimit.enabled
      - application.inactivityLimit.limitInMinutes
    visible_effects:
      - controls whether startup reminds about an existing passbird-export.json file
      - controls whether inactivity can terminate an otherwise running session
  - name: password_generation_and_confirmation
    keys:
      - application.password.length
      - application.password.specialCharacters
      - application.password.promptOnRemoval
      - application.password.customPasswordConfigurations
    visible_effects:
      - changes generated password shape and whether destructive password updates require confirmation
      - changes which custom set configurations appear in s? help output and which s[1-9][EggId] commands are available
    behavioral_contract:
      - the default set configuration is addressed as slot 0 in s? output and uses application.password.length plus application.password.specialCharacters while keeping numbers, lowercase letters, and uppercase letters enabled
      - custom password configurations are addressed by 1-based list position so the first entry backs s1[EggId], the second backs s2[EggId], and so on
      - a password configuration is valid only if length is positive
      - a password configuration is valid only if at least one character type is enabled across numbers, lowercase letters, uppercase letters, or special characters
      - a password configuration is valid only if length is at least the number of enabled character-type groups
      - if special characters are the only enabled character type, unusedSpecialCharacters may exclude at most 20 characters
      - if special characters are enabled, at least one allowed special character must remain after excluding unusedSpecialCharacters
      - if a selected custom configuration slot does not exist in the configured list, Passbird aborts the set command with Specified configuration does not exist - Operation aborted.
      - if a selected custom configuration resolves to invalid password requirements, Passbird aborts the set command with Specified configuration is invalid - Operation aborted.
      - s? output prints each custom configuration name and length
      - s? output also prints no numbers, no letters, no lowercase letters, no uppercase letters, no special characters, and unused special characters details according to the configured flags
      - unused special characters are only shown in s? output when that custom configuration still enables special characters
  - name: yolk_behavior
    keys:
      - application.yolk.algorithm
      - application.yolk.copyToClipboard
      - application.yolk.digits
      - application.yolk.periodSeconds
    visible_effects:
      - changes which TOTP algorithm, digit count, and period are used when y+[EggId] stores a plain Base32 secret
      - changes whether the live y[EggId] view copies each displayed TOTP code to the clipboard
    behavioral_contract:
      - application.yolk.algorithm must resolve to a supported TOTP algorithm name
      - application.yolk.digits must be either 6 or 8
      - application.yolk.periodSeconds must be positive
      - if y+[EggId] receives an otpauth://totp URI, the URI-provided algorithm, digit count, and period override the configured fallback values
      - if y+[EggId] receives only a plain Base32 secret, Passbird stores the secret using application.yolk.algorithm, application.yolk.digits, and application.yolk.periodSeconds
      - y[EggId] waits for the next TOTP code first only when the currently valid code has 5 or fewer seconds remaining
      - when application.yolk.copyToClipboard is true, y[EggId] posts the displayed TOTP code to the clipboard when the live view opens and on each later rollover
      - when application.yolk.copyToClipboard is false, y[EggId] does not post TOTP codes to the clipboard
  - name: backup_and_storage_locations
    keys:
      - application.backup.location
      - application.backup.numberOfBackups
      - application.backup.configuration.enabled
      - application.backup.keyStore.enabled
      - application.backup.passwordTree.enabled
      - adapter.keyStore.location
      - adapter.passwordTree.location
    visible_effects:
      - changes where passbird.sec and passbird.tree are read and written
      - changes where backup files are written and how many distinct backups are retained
      - setup-created configurations persist the chosen storage directory instead of silently keeping an empty or previous location
    behavioral_contract:
      - a backup category runs only if its enabled flag is true and its effective numberOfBackups is greater than 0
      - per-category numberOfBackups overrides the global application.backup.numberOfBackups when set
      - per-category location overrides application.backup.location when set; otherwise the global backup location is used
      - if no matching backup exists yet for a category, Passbird creates one backup immediately
      - for configuration and keystore backups, Passbird creates a new backup only when the current file bytes differ from the latest backup bytes
      - for password-tree backups, Passbird compares decrypted current-format content so encryption randomness alone does not create a new backup
      - if password-tree backup is enabled and passbird.tree is missing at shutdown, Passbird first syncs the current password-tree snapshot so backup comparison has a concrete file to evaluate
      - if passbird.tree exists but cannot be decrypted as current password-tree data at shutdown, Passbird does not create a password-tree backup and does not delete existing password-tree backups for that run
      - if the password tree content has not changed, Passbird keeps the existing backups unchanged even at the retention limit
      - when multiple changed backups for the same file are created within one timestamp second, Passbird appends collision suffixes so the snapshots remain distinct backups
      - when a new distinct backup is created above the retention limit, Passbird removes the oldest matching backups and keeps only the newest retained set
      - encountering a legacy password-tree backup format causes one fresh current-format backup to be created; repeated runs after that do not keep creating duplicates if content is unchanged
  - name: clipboard_behavior
    keys:
      - adapter.clipboard.reset.enabled
      - adapter.clipboard.reset.delaySeconds
    visible_effects:
      - when enabled, clipboard copies are cleared automatically after the configured delay
      - adapter.clipboard.reset.delaySeconds must be zero or positive for automatic clearing to be schedulable
      - if the reset delay cannot be scheduled or the automatic clear operation fails, Passbird reports the clipboard failure through stderr
      - posting a newer clipboard value resets the pending clear timer so only the latest generation is cleared
      - when disabled, clipboard content is not auto-cleared by Passbird
  - name: terminal_behavior
    keys:
      - adapter.userInterface.ansiEscapeCodes.enabled
      - adapter.userInterface.audibleBell
      - adapter.userInterface.secureInput
    visible_effects:
      - changes whether the startup banner and formatted CLI output use ANSI colors
      - changes whether abort-formatted output can trigger an audible terminal bell
      - changes whether sensitive prompts require hidden console input or are allowed to use plain visible line input
  - name: memory_and_proteins
    keys:
      - domain.eggIdMemory.enabled
      - domain.eggIdMemory.persisted
      - domain.protein.secureProteinStructureInput
      - domain.protein.promptForProteinStructureInputToggle
      - domain.protein.templates
    visible_effects:
      - changes whether recent EggIds are shown and remembered across restarts
      - changes whether Protein structure input is hidden and whether the user is prompted to toggle it
      - changes which guided Protein templates are available to p+[EggId]
    behavioral_contract:
      - domain.eggIdMemory.enabled controls whether EggId memory is updated at all during session activity
      - if domain.eggIdMemory.enabled is false, in-session memory updates are suppressed and restored memory is effectively unavailable
      - cross-restart EggId memory restoration requires both domain.eggIdMemory.enabled and domain.eggIdMemory.persisted to be true
      - if domain.eggIdMemory.persisted is false, Passbird restores empty EggId memory on startup even if older tree data contains remembered entries
      - domain.protein.secureProteinStructureInput controls only the Protein Structure prompt, not the Protein Type prompt
      - if domain.protein.secureProteinStructureInput is true, Protein Structure input uses secure input by default; if false, it uses plain visible line input by default
      - if domain.protein.promptForProteinStructureInputToggle is true, Passbird asks once before the Protein Structure prompt whether secure input should be flipped for that next structure input only
      - when the configured default is secure input, the toggle prompt text starts with Disable secure input for next input? Y/n
      - when the configured default is plain input, the toggle prompt text starts with Enable secure input for next input? Y/n
      - only explicit y or Y flips the structure-input mode for that next prompt; any other response leaves the configured mode unchanged
      - domain.protein.templates configures zero or more guided Protein templates for p+[EggId]
      - each Protein template requires a unique non-blank name and may define any subset of slots 0 through 9
      - each configured template slot value is the Protein Type that p+[EggId] uses when prompting for that slot in template mode
      - undefined template slots are skipped by p+[EggId]
      - selecting a configured template with no defined slots aborts p+[EggId] with Specified template is empty - Operation aborted.
      - duplicate Protein template names, template slot keys outside 0 through 9, and non-string template slot values make the configuration invalid and abort startup
  - name: password_tree_integrity_checks
    keys:
      - adapter.passwordTree.verifySignature
      - adapter.passwordTree.verifyChecksum
      - adapter.passwordTree.location
    visible_effects:
      - changes where passbird.tree is restored from and synced to
      - changes whether signature and checksum mismatches only warn or also terminate the current restore path
    behavioral_contract:
      - if passbird.tree is missing at the configured location, Passbird restores an empty password tree instead of treating this as a decrypt failure
      - if passbird.tree exists but cannot be decrypted or unwrapped, Passbird reports the decrypt failure for passbird.tree and exits with a non-zero process status instead of falling back to an empty tree
      - if verifySignature is true and the stored signature is invalid, Passbird reports the signature failure and exits with a non-zero process status during restore
      - if verifySignature is false and the stored signature is invalid, Passbird still reports the signature failure but continues restoring the tree
      - if verifyChecksum is true and the stored checksum is invalid, Passbird reports the checksum failure and exits with a non-zero process status during restore
      - if verifyChecksum is false and the stored checksum is invalid, Passbird still reports the checksum failure but continues restoring the tree
configuration_rules:
  - invalid configuration files must abort startup with a non-zero process status after reporting the load failure
  - missing configuration and invalid configuration are different product states and must not be treated the same
  - setup must consume the directory the user entered and must not silently fall back to another directory
  - setup must not continue to keystore creation if writing passbird.yml fails
  - weakening verifySignature or verifyChecksum changes corruption-handling behavior and must be treated as a user-visible integrity-policy change
  - user-visible configuration defaults are part of the product contract and should be reflected here and in CONFIGURATION.md
