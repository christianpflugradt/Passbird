schema_version: 1
last_reviewed: 2026-05-25
security_posture:
  classification: high_sensitivity_local_secret_manager
  posture:
    - offline_only by product design
    - local file persistence
    - secure defaults preferred over convenience defaults
    - integrity verification built into password tree restore
    - Gradle dependency verification protects third-party runtime and build artifacts with checksums and trusted signing keys where available
  explicit_limits:
    - README says the project has not been reviewed by security experts
    - agent docs must not overstate security guarantees beyond code and README
sensitive_assets:
  - master password entered by the user
  - keystore secret stored in passbird.sec
  - decrypted EggIds and Favorite mappings
  - decrypted password and protein content
  - password tree bytes in passbird.tree
  - exported plaintext-equivalent password data in passbird-export.json
current_security_relevant_implementation:
  migration_boot_path:
    files:
      - src/main/kotlin/de/pflugradts/passbird/application/boot/launcher/PassbirdLauncher.kt
      - src/main/kotlin/de/pflugradts/passbird/application/boot/migration/MigrationModule.kt
      - src/main/kotlin/de/pflugradts/passbird/application/boot/migration/PassbirdMigration.kt
      - src/main/kotlin/de/pflugradts/passbird/application/process/migration/MigrationProcessing.kt
    facts:
      - startup may be routed into a dedicated migration boot path before the main application boot path starts
      - migration routing exists for compatibility-sensitive persistence changes such as keystore work, password-tree key-derivation updates, and password-tree format extensions
      - migration authentication may reuse one successful keystore unlock across multiple migrations within the same migration boot run
      - migration boot may require a separate authenticated session from the normal application startup and exits after reporting success instead of continuing into the main loop
  crypto_provider_factory:
    file: src/main/kotlin/de/pflugradts/passbird/application/security/CryptoProviderFactory.kt
    facts:
      - delegates keystore password prompting and verification to KeyStoreAuthenticationService
      - allows three authentication attempts before exit
  keystore_authentication:
    file: src/main/kotlin/de/pflugradts/passbird/application/security/KeyStoreAuthenticationService.kt
    facts:
      - prompts for the keystore password through secure terminal input
      - fails closed when secure input is enabled but no console is available instead of falling back to echoed stdin
      - invalidates secure input buffers after converting them for keystore access
      - treats empty and incorrect passwords as unsuccessful attempts
  keystore:
    file: src/main/kotlin/de/pflugradts/passbird/adapter/keystore/KeyStoreService.kt
    facts:
      - uses PKCS12 via SystemOperation for the current runtime keystore format
      - stores a generated AES secret key under alias PwMan3Secret
      - can re-protect the existing AES secret under a new master password without regenerating the secret
      - keeps legacy JCEKS read compatibility limited to the migration boot path instead of the normal runtime path
      - scrambles password material and temporary char arrays after use, including exception paths
  local_persistence:
    files:
      - src/main/kotlin/de/pflugradts/passbird/application/util/SystemOperation.kt
      - src/main/kotlin/de/pflugradts/passbird/application/configuration/ConfigurationSyncService.kt
      - src/main/kotlin/de/pflugradts/passbird/adapter/exchange/FilePasswordExchange.kt
      - src/main/kotlin/de/pflugradts/passbird/application/process/backup/BackupManager.kt
    facts:
      - writes sensitive files through temp-file replacement in the target directory before best-effort permission tightening
      - applies owner-only POSIX permissions to newly written sensitive files when the filesystem exposes a PosixFileAttributeView
      - creates backup directories with owner-only POSIX permissions when supported, while treating non-POSIX filesystems as a no-op instead of a failure
      - compares decrypted password tree content before rotating tree backups so AES-GCM IV changes alone do not consume backup slots
      - treats a latest password-tree backup from a legacy tree format as changed and creates one fresh current-format backup instead of aborting session shutdown
  cipher:
    file: src/main/kotlin/de/pflugradts/passbird/application/security/AesGcmCipher.kt
    facts:
      - uses AES/GCM/NoPadding
      - uses a 12-byte IV generated from SecureRandom
      - uses the loaded keystore secret bytes directly as the AES key material for the current password tree format
      - keeps the former PBKDF2WithHmacSHA256 static-salt 100-iteration derivation only as a legacy migration path for pre-migration password trees
  password_tree_integrity:
    files:
      - src/main/kotlin/de/pflugradts/passbird/adapter/passwordtree/PasswordTreeReader.kt
      - src/main/kotlin/de/pflugradts/passbird/adapter/passwordtree/PasswordTreeWriter.kt
      - src/main/kotlin/de/pflugradts/passbird/application/passwordtree
    facts:
      - stores the current password tree as a versioned outer file envelope wrapped around the AES-GCM-encrypted binary payload
      - verifies a built-in file signature marker and checksum across the full plaintext payload on restore
      - treats password tree decrypt or read failures as fatal instead of falling back to an empty restore state
      - only publishes mutating password-operation success events after password tree sync succeeds
      - can exit immediately when verification is configured as critical
      - stores eggs, nests, per-nest Favorite slots, and optionally persisted memory in a custom binary layout before encryption
      - detects both legacy pre-envelope password tree files and legacy current-format trees that require a Favorites migration before main startup
  build_supply_chain:
    files:
      - gradle/verification-metadata.xml
      - gradle/verification-keyring.keys
    facts:
      - verifies third-party runtime dependencies and Gradle plugins with checksums and trusted signing keys where available
      - falls back to recorded checksums when upstream artifacts are unsigned or public keys cannot be retrieved
      - uses the ASCII-armored project keyring so trust updates remain reviewable in version control
hard_guardrails:
  - do not add network, browser, or cloud integration without explicit maintainer approval
  - do not log, print, snapshot, or persist decrypted secrets for debugging
  - do not replace secure input flows with plain input flows
  - do not widen secret lifetimes unnecessarily; preserve scrambling and byte-oriented handling where practical
  - do not weaken default verification behavior for checksum or signature checks without an explicit product decision
  - do not silently change the password tree format or keystore behavior
requires_explicit_human_review:
  - any cryptographic algorithm change
  - any change to key derivation parameters or keystore alias semantics
  - any change to password tree binary layout, checksum calculation, or signature handling
  - any change that alters offline-only posture
  - any change that exports more secret material or increases clipboard exposure
  - any default change affecting secure input, inactivity timeout, backup handling, or destructive prompts
security_sensitive_files:
  - src/main/kotlin/de/pflugradts/passbird/application/util/SystemOperation.kt
  - src/main/kotlin/de/pflugradts/passbird/application/configuration/ConfigurationSyncService.kt
  - src/main/kotlin/de/pflugradts/passbird/application/security/AesGcmCipher.kt
  - src/main/kotlin/de/pflugradts/passbird/application/keystore
  - src/main/kotlin/de/pflugradts/passbird/application/passwordtree
  - src/main/kotlin/de/pflugradts/passbird/application/security/CryptoProviderFactory.kt
  - src/main/kotlin/de/pflugradts/passbird/application/process/backup/BackupManager.kt
  - src/main/kotlin/de/pflugradts/passbird/adapter/keystore/KeyStoreService.kt
  - src/main/kotlin/de/pflugradts/passbird/adapter/passwordtree/PasswordTreeReader.kt
  - src/main/kotlin/de/pflugradts/passbird/adapter/passwordtree/PasswordTreeWriter.kt
  - src/main/kotlin/de/pflugradts/passbird/adapter/exchange/FilePasswordExchange.kt
  - src/main/kotlin/de/pflugradts/passbird/adapter/userinterface/CommandLineInterfaceService.kt
validation_matrix:
  crypto_or_persistence_change:
    required:
      - run the focused tests that cover the changed persistence or secret-handling behavior
      - ./gradlew architecture
    recommended:
      - review the latest CI OWASP dependency-check result if dependency risk is part of the change
  dependency_or_build_change:
    required:
      - run only the focused tests relevant to the dependency or build change
    recommended:
      - refresh and review dependency verification metadata when third-party dependencies or Gradle plugins change
      - rely on the pre-commit hook for license, coverage, and full-test enforcement
      - rely on GitHub Actions OWASP dependency-check workflows instead of local runs unless the maintainer explicitly asks otherwise
  ui_or_command_change_touching_secrets:
    required:
      - run the focused unit and integration tests that cover the changed command or secret-handling path
      - ./gradlew architecture
documentation_expectations:
  - if a security-relevant behavior changes, update README or CONFIGURATION.md when user-visible
  - keep wording precise about what is verified, encrypted, or merely obscured
