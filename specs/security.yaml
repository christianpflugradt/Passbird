schema_version: 1
last_reviewed: 2026-05-30
security_posture:
  classification: high_sensitivity_local_secret_manager
  posture:
    - offline_only by product design
    - local file persistence
    - secure defaults preferred over convenience defaults
    - integrity verification built into password tree restore
    - Gradle dependency verification protects third-party runtime and build artifacts with checksums and trusted signing keys where available
  explicit_limits:
    - README says the project has not been reviewed by security experts
    - agent docs must not overstate security guarantees beyond code and README
sensitive_assets:
  - master password entered by the user
  - keystore secret stored in passbird.sec
  - decrypted EggIds and Favorite mappings
  - decrypted password and protein content
  - decrypted yolk secrets and generated TOTP codes
  - password tree bytes in passbird.tree
- decrypted CSV data from passbird-export.zip, including passwords and MFA secrets
current_security_relevant_implementation:
  migration_boot_path:
    files:
      - src/main/kotlin/de/pflugradts/passbird/application/boot/launcher/PassbirdLauncher.kt
      - src/main/kotlin/de/pflugradts/passbird/application/boot/migration/MigrationGraph.kt
      - src/main/kotlin/de/pflugradts/passbird/application/boot/migration/PassbirdMigration.kt
      - src/main/kotlin/de/pflugradts/passbird/application/process/migration/MigrationProcessing.kt
    facts:
      - migration composition remains available for future compatibility-sensitive persistence changes
      - no migration detector or migration implementation is currently registered
      - a future authenticated migration can reuse one successful keystore unlock across its migration boot run
  crypto_provider_factory:
    file: src/main/kotlin/de/pflugradts/passbird/application/security/CryptoProviderFactory.kt
    facts:
      - delegates keystore password prompting and verification to KeyStoreAuthenticationService
      - allows three authentication attempts before exit
      - failed startup authentication exits with a non-zero process status after reporting the login failure
  keystore_authentication:
    file: src/main/kotlin/de/pflugradts/passbird/application/security/KeyStoreAuthenticationService.kt
    facts:
      - prompts for the keystore password through secure terminal input
      - fails closed when secure input is enabled but no console is available instead of falling back to echoed stdin
      - invalidates secure input buffers after converting them for keystore access
      - treats empty and incorrect passwords as unsuccessful attempts
  terminal_input:
    file: src/main/kotlin/de/pflugradts/passbird/adapter/userinterface/CommandLineInterfaceService.kt
    facts:
      - visible and secure terminal reads poll the inactivity termination signal while waiting for input
      - secure terminal reads preserve the fail-closed no-console rule instead of falling back to visible input
      - secure terminal reads clear the original console CharArray after converting it into Passbird's Shell representation
      - terminal output rendering uses a copied Shell for emission and scrambles that copy after rendering
  clipboard:
    file: src/main/kotlin/de/pflugradts/passbird/adapter/clipboard/ClipboardService.kt
    facts:
      - when adapter.clipboard.nativeTooling.enabled is true, Passbird first tries an OS-native clipboard utility and silently falls back to Java clipboard integration if that native path is unavailable or fails
      - when adapter.clipboard.nativeTooling.enabled is false, Passbird uses Java clipboard integration directly
      - initial clipboard copy failures are reported through stderr and cause the clipboard adapter result to fail
      - when clipboard reset is enabled, reset scheduling failures and failed automatic clear attempts are reported through stderr
      - posting a newer clipboard value supersedes older pending clear attempts so only the latest copied value is cleared
      - when application.yolk.copyToClipboard is true, the live y[EggId] view copies the currently displayed TOTP code to the clipboard and refreshes that clipboard content again on each later TOTP rollover while the view remains open
  guided_use_flow:
    files:
      - src/main/kotlin/de/pflugradts/passbird/application/commandhandling/handler/egg/UseCommandHandler.kt
      - src/main/kotlin/de/pflugradts/passbird/application/yolk/LiveYolkView.kt
      - src/main/kotlin/de/pflugradts/passbird/adapter/userinterface/hotkey/GlobalHotkeyService.kt
    facts:
      - u[EggId] reveals or copies secret material only after explicit user command entry
      - the optional global hotkey exists only while a multi-step guided flow is active and is released through cleanup/finally-style control flow
      - the global hotkey advances an already active guided flow only; it is not an autofill, paste, browser-integration, or background monitoring feature
      - clipboard failure during the guided flow aborts the flow immediately instead of silently continuing to later secrets
      - the Yolk phase of the guided flow reuses the same live TOTP display and clipboard-refresh behavior as y[EggId]
  keystore:
    file: src/main/kotlin/de/pflugradts/passbird/adapter/keystore/KeyStoreService.kt
    facts:
      - uses PKCS12 via adapter.keystore.KeyStoreFactory for the current runtime keystore format
      - stores a generated AES secret key under alias PwMan3Secret
      - can re-protect the existing AES secret under a new master password without regenerating the secret
      - scrambles password material, temporary char arrays, and loaded key-byte copies after use, including exception paths
  local_persistence:
    files:
      - src/main/kotlin/de/pflugradts/passbird/application/util/SystemOperation.kt
      - src/main/kotlin/de/pflugradts/passbird/application/configuration/ConfigurationSyncService.kt
      - src/main/kotlin/de/pflugradts/passbird/adapter/exchange/FilePasswordExchange.kt
      - src/main/kotlin/de/pflugradts/passbird/application/process/backup/BackupManager.kt
    facts:
      - writes sensitive files through temp-file replacement in the target directory before best-effort permission tightening
      - applies owner-only POSIX permissions to newly written sensitive files when the filesystem exposes a PosixFileAttributeView
      - creates backup directories with owner-only POSIX permissions when supported, while treating non-POSIX filesystems as a no-op instead of a failure
      - uses deterministic backup filename collision suffixes so multiple changed same-file backups created within one timestamp second do not overwrite each other
      - compares decrypted password tree content as temporary Shell values and scrambles them after comparison so AES-GCM IV changes alone do not consume backup slots
      - when password-tree backup is enabled but passbird.tree is missing, materializes the current password-tree snapshot before running backup comparison and retention logic
      - when passbird.tree exists but cannot be decrypted as current password-tree data, skips password-tree backup creation and retention deletion for that shutdown backup run
      - treats a latest password-tree backup from a legacy tree format as changed and creates one fresh current-format backup instead of aborting session shutdown
  cipher:
    file: src/main/kotlin/de/pflugradts/passbird/application/security/AesGcmCipher.kt
    facts:
      - uses AES/GCM/NoPadding
      - uses a 12-byte IV generated from SecureRandom
      - uses the loaded keystore secret bytes directly as the AES key material for the current password tree format
      - scrambles transient cipher input byte clones and Cipher.doFinal output arrays after copying them into the returned Shell representation
      - scrambles temporary current-format key bytes after creating SecretKeySpecs
  password_tree_integrity:
    files:
      - src/main/kotlin/de/pflugradts/passbird/domain/service/password/tree/NestingGround.kt
      - src/main/kotlin/de/pflugradts/passbird/domain/service/password/tree/PasswordTreeSyncService.kt
      - src/main/kotlin/de/pflugradts/passbird/domain/service/password/CommonPasswordServiceCapabilities.kt
      - src/main/kotlin/de/pflugradts/passbird/domain/service/nest/NestingGroundService.kt
      - src/main/kotlin/de/pflugradts/passbird/adapter/passwordtree/PasswordTreeReader.kt
      - src/main/kotlin/de/pflugradts/passbird/adapter/passwordtree/PasswordTreeWriter.kt
      - src/main/kotlin/de/pflugradts/passbird/application/passwordtree
    facts:
      - stores the current password tree as a versioned outer file envelope wrapped around the AES-GCM-encrypted binary payload
      - verifies a built-in file signature marker and checksum across the full plaintext payload on restore
      - treats password tree decrypt or read failures as fatal instead of falling back to an empty restore state
      - only publishes mutating password and nest success events after password tree sync succeeds
      - failed password-tree sync restores the live session to the last restored or successfully synced Egg, Favorite, Memory, and Nest snapshot before reporting failure
      - can exit immediately with a non-zero process status when verification is configured as critical
      - stores eggs, nests, per-nest Favorite slots, and optionally persisted memory in a custom binary layout before encryption
      - stores at most one encrypted yolk secret plus its TOTP metadata per Egg in the current password-tree payload format
      - stores per-Egg trash state plus a day-precision deletion timestamp in the current password-tree payload format
      - scrubs full decrypted password-tree payload Shells after restore and full plaintext payload Shells after sync
      - scrubs temporary password-tree checksum ranges, per-entry read buffers, per-entry serialization buffers, and full payload assembly buffers after copying them into their destination owners
      - validates current password-tree payload field boundaries and stored egg nest slots before constructing restore snapshots
  secret_output_paths:
    files:
      - src/main/kotlin/de/pflugradts/passbird/application/commandhandling/handler
      - src/main/kotlin/de/pflugradts/passbird/application/exchange/PasswordImportExportService.kt
    facts:
      - EggId lookup, listing, Nest-discard overlap, and import-preview checks scramble temporary decrypted EggId Shell values after comparison or rendering decisions complete
      - Shell and PlainShell scrambling overwrites each stored byte or character with a different printable random value instead of allowing a same-value replacement
      - command handlers that copy, render, or delegate decrypted password, protein, Favorite, or memory Shell values scramble those temporary Shells after the sink operation completes
      - Shell iteration and streams traverse the owning Shell content without creating extra plaintext byte-array snapshots
      - export collection keeps decrypted Shell values alive only until the exchange adapter send operation returns, then scrambles the exported EggId, password, protein, and yolk Shell values before the command completes
      - import preview and import execution scrub parsed EggId, password, protein, and yolk Shell values after deriving previews or finishing the import attempt
      - plain Base32 yolk parsing decodes directly from mutable Shell bytes and scrubs normalization buffers instead of materializing an immutable plaintext String copy before decode
      - event rendering scrambles decrypted EggId and protein type Shell values after converting them into the user-facing message text
  build_supply_chain:
    files:
      - gradle/verification-metadata.xml
      - gradle/verification-keyring.keys
    facts:
      - verifies third-party runtime dependencies and Gradle plugins with checksums and trusted signing keys where available
      - falls back to recorded checksums when upstream artifacts are unsigned or public keys cannot be retrieved
      - uses the ASCII-armored project keyring so trust updates remain reviewable in version control
hard_guardrails:
  - do not add network, browser, or cloud integration without explicit maintainer approval
  - do not log, print, snapshot, or persist decrypted secrets for debugging
  - do not replace secure input flows with plain input flows
  - do not widen secret lifetimes unnecessarily; preserve scrambling and byte-oriented handling where practical
  - do not weaken default verification behavior for checksum or signature checks without an explicit product decision
  - do not silently change the password tree format or keystore behavior
requires_explicit_human_review:
  - any cryptographic algorithm change
  - any change to key derivation parameters or keystore alias semantics
  - any change to password tree binary layout, checksum calculation, or signature handling
  - any change that alters offline-only posture
  - any change that exports more secret material or increases clipboard exposure
  - any default change affecting secure input, inactivity timeout, backup handling, or destructive prompts
security_sensitive_files:
  - src/main/kotlin/de/pflugradts/passbird/application/util/SystemOperation.kt
  - src/main/kotlin/de/pflugradts/passbird/application/configuration/ConfigurationSyncService.kt
  - src/main/kotlin/de/pflugradts/passbird/adapter/clipboard/ClipboardGateway.kt
  - src/main/kotlin/de/pflugradts/passbird/adapter/keystore/KeyStoreFactory.kt
  - src/main/kotlin/de/pflugradts/passbird/adapter/userinterface/TerminalInputGateway.kt
  - src/main/kotlin/de/pflugradts/passbird/application/security/AesGcmCipher.kt
  - src/main/kotlin/de/pflugradts/passbird/application/keystore
  - src/main/kotlin/de/pflugradts/passbird/application/passwordtree
  - src/main/kotlin/de/pflugradts/passbird/application/security/CryptoProviderFactory.kt
  - src/main/kotlin/de/pflugradts/passbird/application/process/backup/BackupManager.kt
  - src/main/kotlin/de/pflugradts/passbird/adapter/keystore/KeyStoreService.kt
  - src/main/kotlin/de/pflugradts/passbird/adapter/passwordtree/PasswordTreeReader.kt
  - src/main/kotlin/de/pflugradts/passbird/adapter/passwordtree/PasswordTreeWriter.kt
  - src/main/kotlin/de/pflugradts/passbird/adapter/exchange/FilePasswordExchange.kt
  - src/main/kotlin/de/pflugradts/passbird/adapter/userinterface/CommandLineInterfaceService.kt
validation_matrix:
  crypto_or_persistence_change:
    required:
      - run the focused tests that cover the changed persistence or secret-handling behavior
      - ./gradlew architecture
    recommended:
      - review the latest CI OWASP dependency-check result if dependency risk is part of the change
  dependency_or_build_change:
    required:
      - run only the focused tests relevant to the dependency or build change
    recommended:
      - refresh and review dependency verification metadata when third-party dependencies or Gradle plugins change
      - rely on the pre-push hook for license, coverage, full-test, and jar smoke enforcement
      - rely on GitHub Actions OWASP dependency-check workflows instead of local runs unless the maintainer explicitly asks otherwise
  ui_or_command_change_touching_secrets:
    required:
      - run the focused unit and integration tests that cover the changed command or secret-handling path
      - ./gradlew architecture
documentation_expectations:
  - if a security-relevant behavior changes, update README or CONFIGURATION.md when user-visible
  - keep wording precise about what is verified, encrypted, or merely obscured
