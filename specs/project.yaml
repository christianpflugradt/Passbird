schema_version: 1
last_reviewed: 2026-05-24
project:
  name: Passbird
  synopsis: >
    Lightweight terminal-based password manager built in Kotlin. It runs fully
    offline, stores the encryption key in a PKCS12 Java KeyStore, encrypts
    password data with AES-GCM, and persists its data in local files under a
    user-chosen home directory.
  product_principles:
    - offline_first
    - terminal_native
    - local_file_storage
    - security_over_convenience
    - explicit_user_control
  non_goals:
    - browser integration
    - cloud sync
    - network services
    - rich GUI workflows
technical_profile:
  language: Kotlin
  runtime: Java 17
  dependency_injection: Google Guice
  shell_bootstrap: source ~/.zprofile && source ~/.zshrc
  test_stack:
    - JUnit 5
    - jqwik
    - MockK
    - Strikt
    - Awaitility
    - ArchUnit
  build_features:
    - detekt
    - fat_jar_packaging
    - ktlint
    - jacoco
    - pitest mutation testing
    - Gradle dependency verification
    - OWASP dependency check
    - dependency license allowlist
runtime_files:
  home_directory_argument: required
  files:
    - name: passbird.yml
      purpose: user configuration
    - name: passbird.sec
      purpose: PKCS12 keystore containing secret material used as the current crypto provider key material
    - name: passbird.tree
      purpose: versioned password tree persistence file containing an encrypted password tree payload
    - name: passbird-export.json
      purpose: human-readable import and export format
repository_layout:
  - path: src/main/kotlin/de/pflugradts/passbird/application
    role: application boot, command handling, configuration, process orchestration, security factories
  - path: src/main/kotlin/de/pflugradts/passbird/application/passwordtree
    role: shared password-tree envelope and payload format helpers used by adapters, backup comparison, and migrations
  - path: src/main/kotlin/de/pflugradts/passbird/application/keystore
    role: shared keystore format detection helpers used by migration routing and migration-only compatibility adapters
  - path: src/main/kotlin/de/pflugradts/passbird/domain/model
    role: domain entities, value objects, events, transfer primitives
  - path: src/main/kotlin/de/pflugradts/passbird/domain/service
    role: business logic around eggs, nests, password operations, event handling
  - path: src/main/kotlin/de/pflugradts/passbird/adapter
    role: implementations for clipboard, exchange, keystore, password tree, and terminal UI
  - path: src/test/kotlin
    role: unit, property, integration, and architecture tests
  - path: smoke-test
    role: manual jar-level smoke verification assets for interactive terminal workflows
  - path: .github/workflows
    role: GitHub CI, security checks, and release automation
  - path: .github/pages
    role: GitHub Pages configuration and layouts used when publishing the repository documentation and coverage site
key_entrypoints:
  - file: src/main/kotlin/de/pflugradts/passbird/application/Main.kt
    purpose: CLI entrypoint, argument validation, boot selection
  - file: src/main/kotlin/de/pflugradts/passbird/application/boot/migration/MigrationModule.kt
    purpose: dedicated startup path for persistence migrations that must complete before the main application boot path can proceed
  - file: src/main/kotlin/de/pflugradts/passbird/application/boot/main/ApplicationModule.kt
    purpose: Guice bindings and runtime wiring
  - file: src/main/kotlin/de/pflugradts/passbird/application/boot/main/PassbirdApplication.kt
    purpose: interactive main loop
  - file: src/test/kotlin/de/pflugradts/passbird/PassbirdTest.kt
    purpose: architectural guardrail suite
observed_change_patterns:
  recent_history:
    - heavy dependency maintenance via Renovate
    - repeated CI and OWASP workflow hardening
    - recent feature work around egg ID memory and proteins
    - explicit attention to documentation and usage clarity
commands:
  compile: ./gradlew compileKotlin compileTestKotlin compileJava compileTestJava
  unit_tests: ./gradlew test
  property_tests: ./gradlew property
  mutation_tests: ./gradlew mutation
  integration_tests: ./gradlew integration
  architecture_tests: ./gradlew architecture
  full_tests: ./gradlew allTests
  smoke_test: ./smoke-test/run.sh
  lint: ./gradlew ktlintCheck
  static_analysis: ./gradlew detekt
  coverage_gate: ./gradlew jacocoTestCoverageVerification
  license_gate: ./gradlew checkLicense
  owasp: GitHub Actions OWASP dependency-check workflows
  pre_commit: ./gradlew preCommitCheck
release_model:
  versioning: semantic_versioning
  primary_branch: main
  automation:
    - GitHub Actions build, CodeQL, and OWASP workflows verify the repository
    - GitHub Actions build workflow runs dependency-check analysis on push and publishes the GitHub Pages site on main from a temporary Jekyll source assembled from repository documentation and workflow-owned Pages config under .github/pages
    - GitHub Actions build workflow runs a dedicated PIT mutation-testing job for high-risk persistence, exchange, backup, and security code and uploads mutation reports plus line-coverage data as artifacts
    - GitHub Actions refresh the dependency-check cache daily and purge then rebuild it during the Sunday-to-Monday overnight window
    - GitHub Actions build workflow refreshes the branch and instruction coverage badges plus the coverage report on main
    - GitHub Actions publish workflow creates development prereleases on manual dispatch and runs semantic-release every Monday at 03:00 Europe/Berlin for official stable releases
    - official stable releases use plain semantic versions and semantic-release publishes their GitHub tags and GitHub releases with the passbird.jar asset when commit history requires a release
    - manual development prereleases use the latest official stable version as their base and publish passbird.jar assets under GitHub prerelease tags prefixed with dev-
agent_notes:
  - this repo values long-term maintenance, not only passing tests
  - security claims in docs should remain modest; README explicitly says the project is not externally audited
  - any design doc that overstates guarantees is a defect
  - do not add fallback behavior or fallback implementations unless the maintainer explicitly asks for them; if fallback handling is uncertain, stop and ask
  - invalid configuration files must abort startup after reporting the load failure; they must not be treated as missing configuration or routed into setup
  - setup must stop immediately if creating passbird.yml fails; do not continue into keystore creation or restart guidance after a failed configuration write
  - setup directory prompts must consume the entered directory and must never silently fall back to the current working directory or an empty configured path
  - clipboard success messages must only be shown after the clipboard adapter confirms a successful update; never claim a secret was copied when the adapter reported failure
  - when creating or relabeling GitHub issues for compatibility work that keeps a potentially breaking change non-breaking for end users, add the migration label
  - do not add code comments unless the maintainer explicitly asks for them or an existing project convention clearly requires them; never leave design commentary, temporary notes, versioned implementation notes, or other agent-style annotations
  - treat all password-manager wording as maintainer-owned copy; do not change user-visible text without approval for the exact wording
  - use GitHub CLI for GitHub-hosted repository work when local files are not enough; inspect Actions runs or workflow state, issues, pull requests, releases, and repository metadata with gh, preferring rtk gh when the needed subcommand is supported there
  - do not create or switch to a new git branch unless the maintainer explicitly approves that branch action
  - before pushing committed work, run git pull -r on the current branch to integrate remote updates without a merge commit
  - do not run OWASP dependency-check locally for routine verification; use the GitHub Actions workflows unless the maintainer explicitly asks for a local run
  - use smoke-test/run.sh when the maintainer explicitly asks for a manual jar-level interactive smoke pass; it is complementary to Gradle tests rather than part of the default local gate
