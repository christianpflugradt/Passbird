schema_version: 1
last_reviewed: 2026-05-25
flow_family: nests
applies_interaction_rules_from: specs/interaction.yaml
flows:
  - id: view_and_switch
    commands:
      - n
      - n[0-9]
    user_experience:
      view_command:
        - n prints a Current Nest section, an Available Nests section, and an Available Nest commands section in that order
        - the Current Nest section prints the current Nest id directly after Current Nest:
        - the default Nest is shown as slot 0 with the id Default
        - the Available Nests section always includes the default nest line as 0: Default
        - each deployed custom Nest is listed on its own line as <slot>: <NestId>
        - if no custom Nests exist, the Available Nests section appends the hint (use the n+ command to create custom Nests)
        - the Available Nest commands section lists n, n0, n[1-9], n[0-9][EggId], n+[1-9], and n-[1-9]
      switch_command:
        - n0 switches to the default Nest
        - n[1-9] switches to the Nest in the specified slot if that Nest exists
        - successful switching prints no dedicated success line
        - if the requested Nest is already current, Passbird prints '<NestId>' is already the current Nest.
        - if the requested Nest slot does not exist, Passbird prints Specified Nest does not exist - Operation aborted.
        - the missing-Nest abort uses the OPERATION_ABORTED path and therefore also triggers the warning-sound behavior from specs/interaction.yaml
        - every switch path ends with a blank line
  - id: create_nest
    command: n+[1-9]
    user_experience:
      create_new_nest:
        - if the target custom Nest slot is empty, Passbird prompts with Enter name for Nest or nothing to abort and then Your input:
        - this Nest-name prompt uses regular visible input, not secure-input handling
        - non-empty input creates or places the Nest in the requested slot
        - successful creation prints no dedicated success line
        - successful creation ends with a blank line
      rename_existing_nest:
        - if the target custom Nest slot already contains a Nest, Passbird prompts with Enter new name for existing Nest '<current NestId>' or nothing to abort and then Your input:
        - non-empty input replaces the existing Nest name in that slot
        - successful rename prints no dedicated success line
        - successful rename ends with a blank line
      abort_and_guard_paths:
        - empty input prints Empty input - Operation aborted.
        - the empty-input abort uses the OPERATION_ABORTED path and therefore also triggers the warning-sound behavior from specs/interaction.yaml
        - the empty-input path ends with a blank line
        - n+0 is accepted by the current parser but aborts immediately with Default Nest cannot be replaced - Operation aborted.
        - that default-slot abort uses the OPERATION_ABORTED path and returns without the extra trailing blank line used by the other add-Nest paths
  - id: discard_nest
    command: n-[1-9]
    user_experience:
      - the default Nest cannot be discarded
      - discard handling surfaces conflicts such as occupied Nests rather than silently moving data
  - id: assign_and_move
    commands:
      - n[0-9][EggId]
    user_experience:
      - moving an Egg into another Nest respects EggId conflicts
      - conflicting moves abort instead of silently overwriting another Egg
