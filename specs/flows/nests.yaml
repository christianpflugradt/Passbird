schema_version: 1
last_reviewed: 2026-05-25
flow_family: nests
applies_interaction_rules_from: specs/interaction.yaml
flows:
  - id: view_and_switch
    commands:
      - n
      - n[0-9]
    user_experience:
      view_command:
        - n prints a Current Nest section, an Available Nests section, and an Available Nest commands section in that order
        - the Current Nest section prints the current Nest id directly after Current Nest:
        - the default Nest is shown as slot 0 with the id Default
        - the Available Nests section always includes the default nest line as 0: Default
        - each deployed custom Nest is listed on its own line as <slot>: <NestId>
        - if no custom Nests exist, the Available Nests section appends the hint (use the n+ command to create custom Nests)
        - the Available Nest commands section lists n, n0, n[1-9], n[0-9][EggId], n+[1-9], and n-[1-9]
      switch_command:
        - n0 switches to the default Nest
        - n[1-9] switches to the Nest in the specified slot if that Nest exists
        - successful switching prints no dedicated success line
        - if the requested Nest is already current, Passbird prints '<NestId>' is already the current Nest.
        - if the requested Nest slot does not exist, Passbird prints Specified Nest does not exist - Operation aborted.
        - the missing-Nest abort uses the OPERATION_ABORTED path and therefore also triggers the warning-sound behavior from specs/interaction.yaml
        - every switch path ends with a blank line
  - id: create_nest
    command: n+[1-9]
    user_experience:
      create_new_nest:
        - if the target custom Nest slot is empty, Passbird prompts with Enter name for Nest or nothing to abort and then Your input:
        - this Nest-name prompt uses regular visible input, not secure-input handling
        - non-empty input creates or places the Nest in the requested slot
        - successful creation prints no dedicated success line
        - successful creation ends with a blank line
      rename_existing_nest:
        - if the target custom Nest slot already contains a Nest, Passbird prompts with Enter new name for existing Nest '<current NestId>' or nothing to abort and then Your input:
        - non-empty input replaces the existing Nest name in that slot
        - successful rename prints no dedicated success line
        - successful rename ends with a blank line
      abort_and_guard_paths:
        - empty input prints Empty input - Operation aborted.
        - the empty-input abort uses the OPERATION_ABORTED path and therefore also triggers the warning-sound behavior from specs/interaction.yaml
        - the empty-input path ends with a blank line
        - n+0 is accepted by the current parser but aborts immediately with Default Nest cannot be replaced - Operation aborted.
        - that default-slot abort uses the OPERATION_ABORTED path and returns without the extra trailing blank line used by the other add-Nest paths
  - id: discard_nest
    command: n-[1-9]
    user_experience:
      guard_paths:
        - n-0 is accepted by the current parser but aborts immediately with Default Nest cannot be discarded - Operation aborted.
        - if the requested Nest slot does not contain a deployed Nest, Passbird aborts immediately with Specified Nest does not exist - Operation aborted.
        - both immediate guard aborts use the OPERATION_ABORTED path and return without the trailing blank line used by the main discard flow
      empty_nest_discard:
        - if the target Nest exists and contains no Eggs, Passbird discards it immediately without any confirmation or relocation prompt
        - after a successful empty-Nest discard, every Favorite entry owned by the discarded Nest is cleared
        - successful empty-Nest discard prints no dedicated success line
        - successful empty-Nest discard ends with a blank line
      occupied_nest_relocation_prompt:
        - if the target Nest exists and contains Eggs, Passbird prompts with Nest '<NestId>' contains <count> Eggs. Specify a Nest Slot 0-9 to move them to or anything else to abort:
        - this relocation prompt uses regular visible input, not secure-input handling
        - input must be exactly one digit from 0 to 9
        - any non-digit or multi-character input prints Operation aborted.
        - if the chosen target slot has no deployed Nest, Passbird prints Nest Slot <slot> is empty - Operation aborted.
      occupied_nest_conflicts_and_success:
        - if the chosen target Nest already contains any EggIds also present in the Nest being discarded, Passbird prints a multi-line advisory message listing those EggIds
        - that advisory message is followed by a separate Operation aborted. line
        - in that overlap case, Passbird does not move any Eggs and does not discard the Nest
        - if there are no overlaps, Passbird moves every Egg from the discarded Nest into the chosen target Nest and then discards the original Nest
        - after a successful Nest discard, every Favorite entry owned by the discarded Nest is cleared
        - successful occupied-Nest discard prints no dedicated success line
        - all main occupied-Nest paths end with a blank line
      current_nest_restoration:
        - if a different Nest was current before discard processing began, Passbird returns to that original current Nest after processing
        - if the Nest being discarded was itself current, Passbird ends in the default Nest after processing
  - id: assign_and_move
    commands:
      - n[EggId]
    user_experience:
      target_selection:
        - after validating that the source Egg exists, Passbird prints an Available Nests section before asking for the target Nest
        - the target list excludes the current Nest and includes only selectable destination Nests
        - if the current Nest is default, only deployed custom Nests are listed as targets
        - if the current Nest is custom, the target list includes 0: Default and any other deployed custom Nests except the current one
        - Passbird then prompts with Enter Nest you want to move Egg to:
        - this target-Nest prompt uses regular visible input, not secure-input handling
      source_egg_gating:
        - if the source Egg does not exist, Passbird does not print the target-selection list or prompt
        - a missing source Egg triggers the standard not-found event output Egg '<EggId>' not found.
        - the not-found event also triggers the warning sound defined in specs/interaction.yaml
      move_and_conflict_rules:
        - if the chosen target slot is the current Nest, Passbird prints Egg is already in the specified Nest - Operation aborted.
        - if the chosen target slot does not contain a deployed Nest, Passbird prints Specified Nest does not exist - Operation aborted.
        - if a different Egg with the same EggId already exists in the target Nest, Passbird prints Egg with same EggId already exists in target Nest - Operation aborted.
        - on success, Passbird moves the Egg to the selected Nest slot
        - on success, any matching Favorite entries in the source Nest are cleared and no Favorite is created automatically in the target Nest
        - successful moves print no dedicated success line from the handler
      finish:
        - all abort branches in this flow use the OPERATION_ABORTED path and therefore also trigger the warning-sound behavior from specs/interaction.yaml
        - every command path ends with a blank line
