schema_version: 1
last_reviewed: 2026-05-30
flow_family: migration
applies_interaction_rules_from: specs/interaction.yaml
flows:
  - id: migration_boot_reroute
    trigger:
      - startup detects state that requires a compatibility-preserving migration before the normal application boot path can continue
    user_experience:
      - migration is a boot-time reroute, not a command-loop feature
      - if the keystore does not exist or no pre-launch migration is required, Passbird does not enter the migration boot path
      - if the keystore exists and pre-launch migration detection returns at least one pending migration, Passbird launches the dedicated migration boot path instead of the normal application module
      - migration boot happens after the normal launcher license/banner output, not before it
      - the migration boot path never reaches the normal interactive command prompt in the same run
  - id: migration_consent
    trigger:
      - a required migration is pending
    user_experience:
      - migration boot prompts exactly once with Migration required before using Passbird. Migration will run automatically. Make sure you have an up to date backup. If something goes wrong, revert to the previous version. Continue Y/n?
      - this prompt uses the global receiveYes semantics from specs/interaction.yaml
      - continuing requires explicit y or Y
      - empty input is not affirmative
      - if the user declines or presses enter, Passbird runs no migrations, prints no success line, invalidates migration authentication state, and exits immediately
      - if the user accepts, Passbird merges the already-detected pre-launch migrations with any authenticated migration detections before execution
  - id: migration_authentication_session
    trigger:
      - at least one pending migration requires authenticated access to the current keystore contents
    user_experience:
      - the current authenticated migrations use the default secure prompt Enter key:
      - this prompt uses secure-input handling and therefore follows the secure-input fallback rules from specs/interaction.yaml
      - each authenticated migration requests credentials through the shared migration authentication service
      - if no credentials are cached yet, Passbird allows up to 3 attempts with the same Enter key: prompt
      - failed attempts repeat the same prompt until authentication succeeds or 3 attempts have been consumed
      - if authentication still fails after 3 attempts, Passbird reports Login failed. Shutting down after 3 unsuccessful attempts. and exits with a non-zero process status
      - after the first successful migration authentication in a run, Passbird caches the resulting credentials for reuse
      - later authenticated migrations in the same migration run reuse those cached credentials without prompting again
      - when multiple authenticated migrations are pending together, the user is prompted only once for the whole migration session
  - id: keystore_format_migration
    trigger:
      - the keystore file exists and its leading bytes identify the legacy JCEKS format
    user_experience:
      - this migration contributes the pending migration id keystore-format
      - it is a pre-launch migration and therefore participates in the shared migration boot path rather than the normal command loop
      - it runs before password-tree-key-derivation when both migrations are pending in the same run
      - after successful shared migration authentication, Passbird rewrites the existing keystore file in place using the current keystore writer
      - the migrated keystore is stored in the current PKCS12 format rather than the legacy JCEKS format
      - the master password the user entered for migration continues to unlock the migrated keystore after migration
      - the stored secret inside the keystore is preserved across the format migration
      - after successful migration, future startup detection no longer requests keystore-format migration for that keystore file
      - this migration produces no dedicated user-visible success line beyond the shared overall migration success message
  - id: password_tree_key_derivation_migration
    trigger:
      - the password tree file exists, is non-empty, and is still in the legacy pre-envelope format
    user_experience:
      - this migration contributes the pending migration id password-tree-key-derivation
      - it is a pre-launch migration and therefore participates in the shared migration boot path rather than the normal command loop
      - it runs after keystore-format when both migrations are pending in the same run
      - after successful shared migration authentication, Passbird decrypts the legacy password tree with the legacy key-derivation path and rewrites it directly in the latest password-tree format
      - the migrated password tree is wrapped in the current password-tree envelope format after migration
      - the stored eggs, passwords, proteins, nest assignments, and persisted EggId memory entries are preserved across the migration
      - Favorite slots are initialized empty because the legacy source format predates Favorite persistence
      - because this migration rewrites directly into the latest password-tree format, no follow-up password-tree-favorites migration is required for the same file
      - the migrated password tree remains readable with the current crypto path after migration
      - after successful migration, future startup detection no longer requests password-tree-key-derivation migration for that password tree file
      - this migration produces no dedicated user-visible success line beyond the shared overall migration success message
  - id: password_tree_favorites_migration
    trigger:
      - the password tree file exists, is non-empty, and uses the immediately previous password-tree envelope and payload layout that predates Favorite persistence
    user_experience:
      - this migration contributes the pending migration id password-tree-favorites
      - it is a pre-launch migration and therefore participates in the shared migration boot path rather than the normal command loop
      - this migration is requested only for the previous current-format tree layout; missing files, empty files, legacy pre-envelope files, and already-latest trees do not trigger it
      - it runs after keystore-format when both migrations are pending in the same run
      - this migration does not co-occur with password-tree-key-derivation for the same password tree because the two detectors target different source formats
      - after successful shared migration authentication, Passbird decrypts the previous current-format password tree and rewrites it in the latest Favorites-capable password-tree format
      - the stored eggs, passwords, proteins, nest assignments, and persisted EggId memory entries are preserved across the migration
      - Favorite slots are initialized empty across all Nests during migration
      - after the next normal startup, Favorite commands are available immediately but every Favorite slot starts empty until the user assigns one
      - the migrated password tree remains readable with the current crypto path after migration
      - after successful migration, future startup detection no longer requests password-tree-favorites migration for that password tree file
      - this migration produces no dedicated user-visible success line beyond the shared overall migration success message
  - id: migration_completion
    trigger:
      - pending migrations finish successfully
    user_experience:
      - pending migrations run in registered order
      - after all requested migrations finish, Passbird prints exactly Migration successful. Please start Passbird again
      - after migration boot, Passbird always invalidates cached migration credentials and exits the process
      - successful migration does not fall through into the normal application command loop in the same run
