schema_version: 1
last_reviewed: 2026-05-25
flow_family: passwords
applies_interaction_rules_from: specs/interaction.yaml
flows:
  - id: set_or_replace_password
    commands:
      - s[EggId]
      - s[1-9][EggId]
    user_experience:
      - generation uses the active default or selected custom password configuration
      - replacing an existing password may require explicit confirmation depending on configuration
  - id: custom_set_password
    commands:
      - c[EggId]
    user_experience:
      confirmation_behavior:
        - if promptOnRemoval is disabled or the Egg does not already exist, Passbird skips overwrite confirmation
        - if promptOnRemoval is enabled and the Egg already exists, Passbird prompts with Existing Egg '<EggId>' will be irrevocably overwritten.
        - the overwrite prompt then continues with Input 'c' to confirm or anything else to abort. and Your input:
        - declining that confirmation prints Operation aborted.
      password_entry:
        - after confirmation, Passbird prompts with Enter custom Password:
        - the input is received through secure-input handling and therefore follows the secure-input fallback rules from specs/interaction.yaml
        - empty password input prints Empty input - Operation aborted.
        - non-empty password input is stored exactly as entered
      validation_and_finish:
        - invalid EggId input prints <validation-message> - Operation aborted.
        - every command path ends with a blank line
  - id: reveal_view_copy
    commands:
      - g[EggId]
      - v[EggId]
    user_experience:
      get_command:
        - g[EggId] reads the stored password and posts it to the clipboard
        - on successful clipboard update, Passbird prints Password copied to clipboard.
        - if the Egg does not exist, Passbird prints no success line
        - if the clipboard update fails, Passbird prints no success line from the command handler
        - with the default clipboard adapter, clipboard failure reporting is delegated to stderr
        - every command path ends with a blank line
      view_command:
        - v[EggId] prints the stored password value directly to stdout
        - if the Egg does not exist, Passbird prints no password line
        - every command path ends with a blank line
      cross_cutting_rules:
        - secrets are only revealed or copied on explicit command
        - clipboard reset behavior after g[EggId] is configuration-controlled
  - id: rename_and_discard
    commands:
      - r[EggId]
      - d[EggId]
    user_experience:
      - empty rename input aborts
      - discard and overwrite-style flows use explicit c-style confirmation where specified
  - id: change_master_password
    command: k
    user_experience:
      - prompts once for the current key and twice for the new key
      - empty new-key input aborts
      - mismatched repeated input aborts
      - an incorrect current key aborts without partial success
