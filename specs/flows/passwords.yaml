schema_version: 1
last_reviewed: 2026-05-25
flow_family: passwords
applies_interaction_rules_from: specs/interaction.yaml
flows:
  - id: set_or_replace_password
    commands:
      - s[EggId]
      - s[1-9][EggId]
    user_experience:
      configuration_selection:
        - s[EggId] uses the active default password configuration
        - s[1-9][EggId] selects the corresponding custom password configuration slot
        - if the selected custom configuration slot does not exist, Passbird prints Specified configuration does not exist - Operation aborted.
        - if the selected or default configuration is invalid, Passbird prints Specified configuration is invalid - Operation aborted.
      overwrite_confirmation:
        - if promptOnRemoval is disabled or the Egg does not already exist, Passbird skips overwrite confirmation
        - if promptOnRemoval is enabled and the Egg already exists, Passbird prompts with Existing Egg '<EggId>' will be irrevocably overwritten.
        - the overwrite prompt then continues with Input 'c' to confirm or anything else to abort. and Your input:
        - declining that confirmation prints Operation aborted.
      generation_and_validation:
        - after confirmation, Passbird validates the EggId before storing the generated password
        - invalid EggId input prints <validation-message> - Operation aborted.
        - on success, Passbird generates a password from the selected requirements and stores it without any extra success line
      finish:
        - every command path ends with a blank line
  - id: one_time_set_password
    commands:
      - s*[EggId]
    user_experience:
      validation_and_length_prompt:
        - Passbird validates the EggId before asking any one-time configuration questions
        - invalid EggId input prints <validation-message> - Operation aborted.
        - valid input prompts with Enter password length or just press enter to abort:
        - empty length input prints Empty input - Operation aborted.
        - non-numeric length input prints Specified configuration is invalid - Operation aborted.
      interactive_requirement_prompts:
        - after a numeric length, Passbird prompts in this exact order: Include numbers? Y/n, Include lowercase letters? Y/n, Include uppercase letters? Y/n, Include special characters? Y/n
        - these Y/n prompts still use the global confirmation semantics from specs/interaction.yaml, so empty input is not affirmative
        - if special characters are included, Passbird then prompts with Enter unused special characters or just press enter to keep all:
        - if special characters are not included, the unused-special-characters prompt is skipped
        - if the resulting one-time requirements are invalid, Passbird prints Specified configuration is invalid - Operation aborted.
      overwrite_confirmation:
        - overwrite confirmation is evaluated only after the one-time requirements have already been collected
        - if promptOnRemoval is disabled or the Egg does not already exist, Passbird skips overwrite confirmation
        - if promptOnRemoval is enabled and the Egg already exists, Passbird prompts with Existing Egg '<EggId>' will be irrevocably overwritten.
        - the overwrite prompt then continues with Input 'c' to confirm or anything else to abort. and Your input:
        - declining that confirmation prints Operation aborted.
      success_and_finish:
        - on success, Passbird generates a password from the collected one-time requirements and stores it without any extra success line
        - every command path ends with a blank line
  - id: custom_set_password
    commands:
      - c[EggId]
    user_experience:
      confirmation_behavior:
        - if promptOnRemoval is disabled or the Egg does not already exist, Passbird skips overwrite confirmation
        - if promptOnRemoval is enabled and the Egg already exists, Passbird prompts with Existing Egg '<EggId>' will be irrevocably overwritten.
        - the overwrite prompt then continues with Input 'c' to confirm or anything else to abort. and Your input:
        - declining that confirmation prints Operation aborted.
      password_entry:
        - after confirmation, Passbird prompts with Enter custom Password:
        - the input is received through secure-input handling and therefore follows the secure-input rules from specs/interaction.yaml
        - empty password input prints Empty input - Operation aborted.
        - non-empty password input is stored exactly as entered
      validation_and_finish:
        - invalid EggId input prints <validation-message> - Operation aborted.
        - every command path ends with a blank line
  - id: reveal_view_copy
    commands:
      - g[EggId]
      - v[EggId]
    user_experience:
      get_command:
        - g[EggId] reads the stored password and posts it to the clipboard
        - on successful clipboard update, Passbird prints Password copied to clipboard.
        - if the Egg does not exist, Passbird prints no success line
        - if the clipboard update fails, Passbird prints no success line from the command handler
        - with the default clipboard adapter, clipboard failure reporting is delegated to stderr
        - every command path ends with a blank line
      view_command:
        - v[EggId] prints the stored password value directly to stdout
        - if the Egg does not exist, Passbird prints no password line
        - every command path ends with a blank line
      cross_cutting_rules:
        - secrets are only revealed or copied on explicit command
        - clipboard reset behavior after g[EggId] is configuration-controlled
  - id: rename_and_discard
    commands:
      - r[EggId]
      - d[EggId]
    user_experience:
      rename_command:
        - if the source Egg does not exist, Passbird does not prompt for a new EggId
        - a missing source Egg triggers the standard not-found event output Egg '<EggId>' not found.
        - the not-found event also triggers the warning sound defined in specs/interaction.yaml
        - if the source Egg exists, Passbird prompts with Enter new EggId or nothing to abort:
        - this rename prompt uses regular visible input, not secure-input handling
        - empty rename input prints Empty input - Operation aborted.
        - invalid replacement EggId input prints <validation-message> - Operation aborted.
        - if the replacement EggId already exists, Passbird prints EggId '<new EggId>' already exists - Operation aborted.
        - on success, the rename event prints Egg '<new EggId>' successfully renamed.
        - on success, any matching Favorite entries in the Egg's Nest are updated to the renamed EggId
        - every rename path ends with a blank line
      discard_command:
        - discard first checks whether the Egg currently exists
        - if the Egg does not exist, Passbird does not prompt for confirmation
        - a missing Egg triggers the standard not-found event output Egg '<EggId>' not found.
        - the not-found event also triggers the warning sound defined in specs/interaction.yaml
        - if promptOnRemoval is disabled and the Egg exists, Passbird discards immediately
        - if promptOnRemoval is enabled and the Egg exists, Passbird prompts with Discarding an Egg is an irrevocable action.
        - the discard prompt then continues with Input 'c' to confirm or anything else to abort. and Your input:
        - declining that confirmation prints Operation aborted.
        - on success, the discard event prints Egg '<EggId>' successfully discarded.
        - on success, any matching Favorite entries in the Egg's Nest are cleared
        - every discard path ends with a blank line
  - id: change_master_password
    command: k
    user_experience:
      entry_and_preamble:
        - the command starts by printing a blank line
        - Passbird then prints this exact preamble as one visible text block: Your Passbird Keystore will be secured by a master password. This master password gives access to all passwords stored in Passbird. If you lose this password, you will not be able to access any passwords stored in Passbird. Choose your master password wisely. You have to input your master password twice. Your input will be hidden unless secure input is disabled in your configuration.
        - Passbird then prints another blank line before prompting for the current key
      current_key_authentication:
        - Passbird prompts with Enter current key:
        - the current-key prompt uses secure-input handling and therefore follows the secure-input rules from specs/interaction.yaml
        - this command allows exactly one current-key authentication attempt
        - if current-key authentication fails, Passbird prints Current key is incorrect - Operation aborted.
        - after that abort message, Passbird prints a trailing blank line and stops
      new_key_entry:
        - after successful current-key authentication, Passbird prompts with Enter new key:
        - the first new-key prompt uses secure-input handling and therefore follows the secure-input rules from specs/interaction.yaml
        - empty first new-key input prints Empty input - Operation aborted.
        - after non-empty first input, Passbird prompts with Enter new key again:
        - the repeated new-key prompt also uses secure-input handling and therefore follows the secure-input rules from specs/interaction.yaml
        - empty repeated new-key input prints Empty input - Operation aborted.
        - if the two new-key inputs differ, Passbird prints Your inputs do not match - Operation aborted.
        - every abort in the new-key phase prints a trailing blank line and stops without updating the keystore
      success_and_failure_finish:
        - if the keystore update operation throws, Passbird reports the underlying command failure to stderr and then prints Operation aborted.
        - after matching new-key input, Passbird prints a blank line before the success message
        - on success, Passbird prints Keystore successfully updated.
        - the success message is followed by a trailing blank line
