schema_version: 1
last_reviewed: 2026-05-25
flow_family: setup
applies_interaction_rules_from: specs/interaction.yaml
flows:
  - id: first_run_without_configuration
    trigger:
      - setup graph is booted with configuration.template = true
      - at launcher level this corresponds to startup without a usable configured keystore location, which typically means no usable configuration was provided
    user_experience:
      opening_output:
        - Welcome to Passbird Setup!
        - blank line
      guidance_block:
        - You have landed here because you did not provide a configuration.
        - If you have a configuration file, then please start Passbird as follows:
        - java -jar passbird.jar "absolute-path-to-directory-with-configuration-file"
        - blank line
        - Example for a Linux path: /etc/passbird
        - Example for a Windows path: c:\programs\passbird
        - The configuration file must be in the specified directory and it must be named 'passbird.yml.'
        - blank line
        - To (c)ontinue setup, press 'c'. To quit setup, press any other key
        - prompt: "Your input: "
      confirmation_semantics:
        - only a single-character input c continues
        - cc, any non-c character, or empty input aborts
        - the confirmation prompt uses receiveConfirmation semantics rather than yes/no semantics
      continue_branch:
        - the next visible line is Please input an absolute path to a directory in which to create the 'configuration' file.
        - the flow then proceeds into configuration creation and keystore creation
      abort_branch:
        - no configuration file is written
        - no keystore is created
        - setup then sends Goodbye! and exits the process
    side_effects:
      - may create passbird.yml and passbird.sec in user-chosen directories
  - id: missing_keystore_guidance
    trigger:
      - setup graph is booted with configuration.template = false
      - launcher entered setup because no usable keystore could be resolved
      - the concrete launcher conditions are an empty keyStore.location or a missing passbird.sec at the configured location
    user_experience:
      opening_output:
        - Welcome to Passbird Setup!
        - blank line
      guidance_block:
        - You have landed here because the keystore specified in your configuration does not exist.
        - Your configuration specifies the keystore to be in the following directory: <configured-location>
        - However in that directory there is no file 'passbird.sec'
        - blank line
        - To (c)ontinue setup, press 'c'. To quit setup, press any other key
        - prompt: "Your input: "
      confirmation_semantics:
        - only a single-character input c continues
        - any other input, including empty input, aborts setup
      continue_branch:
        - the next visible line is Please input an absolute path to a directory in which to create the 'keystore' file.
        - the flow then proceeds into keystore creation using the chosen directory instead of the missing configured directory
      abort_branch:
        - no keystore is created
        - setup then sends Goodbye! and exits the process
  - id: configuration_template_write
    trigger:
      - the first-run template route continues after confirmation
      - the user has entered a valid existing directory for configuration creation
    user_experience:
      success_path:
        - configuration sync writes passbird.yml into the chosen directory before any keystore prompts begin
        - after successful configuration sync, setup continues directly into the keystore explanation block
      failure_path:
        - if configuration sync fails, setup does not print the keystore explanation block
        - if configuration sync fails, setup does not ask for first input: or second input:
        - if configuration sync fails, setup does not print Now restart Passbird to use it.
        - setup then falls through to Goodbye! and exits the process
      delegated_error_reporting:
        - configuration sync failure reporting is emitted by the configuration layer on stderr rather than by SetupGuide
        - the current stderr wording is Configuration could not be loaded: <message>
    side_effects:
      - on success, passbird.yml is written to <chosen-directory>/passbird.yml
      - on failure, passbird.yml creation is incomplete or absent and passbird.sec is not created
  - id: keystore_creation
    trigger:
      - setup proceeds into keystore creation
      - template-route keystore creation only starts after a valid configuration directory is entered and configuration sync succeeds
      - missing-keystore-route creation starts after the user confirms setup continuation
    user_experience:
      route_specific_ordering:
        template_route:
          - after Please input an absolute path to a directory in which to create the 'configuration' file. the next prompt is your input:
          - the same directory prompt repeats until the input names an existing directory for which exists(directory) and isDirectory(directory) are both true
          - invalid directory input produces no explanatory error message
          - once configuration sync succeeds, setup prints the keystore explanation block before password capture begins
          - the chosen configuration directory is also the target directory for passbird.sec
        missing_keystore_route:
          - after Please input an absolute path to a directory in which to create the 'keystore' file. setup immediately prints the keystore explanation block
          - only after that explanation block does setup begin directory capture with the prompt your input:
          - the same directory prompt repeats until the input names an existing directory for which exists(directory) and isDirectory(directory) are both true
          - invalid directory input produces no explanatory error message
          - the chosen directory replaces the missing configured keystore location for the new passbird.sec file
      keystore_explanation_block:
        - blank line
        - Your Passbird Keystore will be secured by a master password.
        - This master password gives access to all passwords stored in Passbird.
        - If you lose this password, you will not be able to access any passwords stored in Passbird.
        - Choose your master password wisely.
        - blank line
        - You have to input your master password twice.
        - Your input will be hidden unless secure input is disabled in your configuration.
        - If your inputs do not match, you will have to repeat the procedure.
        - blank line
      password_capture:
        - the first password prompt is "first input: "
        - the second password prompt is "second input: "
        - if secure input is enabled but no console is available, setup aborts keystore creation instead of falling back to visible password input
        - acceptance requires the first input to be non-empty and exactly equal to the second input
        - two empty inputs are rejected and handled the same way as mismatched inputs
        - on every rejected attempt, setup sends Your inputs do not match, please repeat.
        - after a rejected attempt, setup restarts at the first input prompt
        - after a successful matched pair, setup emits one blank line before reporting success
      success_and_exit:
        - Keystore has been created successfully!
        - Now restart Passbird to use it.
        - Goodbye!
        - setup exits the process after Goodbye!
    side_effects:
      - passbird.sec is written to <chosen-directory>/passbird.sec
known_visible_drifts:
  - area: configuration_template_write_failure_wording
    current_stderr_shape: Configuration could not be loaded: <message>
    observed_context:
      - this message is also used when configuration creation or sync fails during setup, even though the operation is a write rather than a load
