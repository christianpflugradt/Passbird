schema_version: 1
last_reviewed: 2026-05-25
flow_family: setup
applies_interaction_rules_from: specs/interaction.yaml
flows:
  - id: first_run_without_configuration
    trigger:
      - Passbird is started without a usable configuration file
    user_experience:
      - setup explains why the user landed in setup and how to start Passbird with a configuration directory
      - continuing setup requires explicit c-style confirmation
      - setup uses blank lines to separate informational blocks
    side_effects:
      - may create passbird.yml and passbird.sec in user-chosen directories
  - id: missing_keystore_guidance
    trigger:
      - configuration exists but the configured keystore file is missing
    user_experience:
      - setup explains the configured location and the missing passbird.sec file
      - continuing still requires explicit confirmation
  - id: keystore_creation
    trigger:
      - setup proceeds into keystore creation
    user_experience:
      - the master-password consequences are explained before input
      - the user enters the master password twice
      - non-matching inputs are surfaced and require repetition
      - restart guidance is shown after successful setup
