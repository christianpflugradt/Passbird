schema_version: 1
last_reviewed: 2026-05-25
flow_family: proteins
applies_interaction_rules_from: specs/interaction.yaml
flows:
  - id: protein_info
    commands:
      - p
      - p?
    user_experience:
      accepted_surface:
        - p and p? both open the same Protein help menu
        - the built-in help text teaches p? rather than bare p, so bare p is an accepted but not explicitly advertised alias
      exact_visible_block:
        - the command begins with one blank line
        - Passbird then prints the heading Available Protein commands:
        - the help block then lists these six indented command lines in this exact order: p?, p[EggId], p*[EggId], p[0-9][EggId], p+[0-9][EggId], p-[0-9][EggId]
        - the corresponding help descriptions are exactly: Displays this help menu for Protein commands.; Displays the Protein Types associated with the specified Egg.; Displays both the Protein Types and their Structures for the specified Egg.; Copies the Protein Structure in the specified Slot (0–9) to the clipboard.; Updates the Protein Structure and optionally the Type in the specified Slot.; Deletes the Protein Structure and Type from the specified Slot.
        - the help block ends with one trailing blank line
  - id: inspect_proteins
    commands:
      - p[EggId]
      - p*[EggId]
    user_experience:
      shared_table_rendering:
        - both commands are read-only views and never modify stored Protein data
        - both commands begin visible table output with one blank line
        - both commands then print the same three-column header with the labels Slot, Type, and Structure
        - the header and each row use a fixed table layout: the Slot cell is padded to width 5, the Type cell to width 20, and the Structure cell to width 20, with cells separated by the literal string " | "
        - rows are rendered in slot order from 0 through 9, where slot 0 is the default Protein slot
        - empty Type cells are rendered as ---
        - empty Structure cells are rendered as ---
        - every inspect path ends with one trailing blank line
      type_only_view:
        - p[EggId] masks every non-empty Structure cell as *****
        - p[EggId] still shows the actual Protein Type in each occupied slot
      structure_detail_view:
        - p*[EggId] shows the actual Structure value in each occupied slot
        - p*[EggId] also shows the actual Protein Type in each occupied slot
      missing_egg_behavior:
        - if the Egg does not exist, the table is skipped entirely
        - a missing Egg triggers the standard event output Egg '<EggId>' not found.
        - the missing-Egg event also triggers the warning sound defined in specs/interaction.yaml
  - id: set_or_replace_protein
    commands:
      - p+[0-9][EggId]
    user_experience:
      command_scope:
        - the addressed slot index selects the Protein slot to create or replace, with 0 addressing the default Protein slot
        - the same command is used both for creating a previously empty Protein slot and for updating an existing Protein slot
      missing_egg_behavior:
        - the command first checks whether the Egg exists
        - if the Egg does not exist, Passbird asks no further questions and does not attempt to store a Protein
        - a missing Egg triggers the standard event output Egg '<EggId>' not found.
        - the missing-Egg event also triggers the warning sound defined in specs/interaction.yaml
        - the missing-Egg path ends with one trailing blank line
      overwrite_confirmation:
        - overwrite confirmation is only considered when the addressed Protein slot already contains a Protein
        - if the slot is empty, Passbird skips overwrite confirmation even when promptOnRemoval is enabled
        - if the slot is occupied and promptOnRemoval is enabled, Passbird prompts with Existing Protein at Slot '<SlotIndex>' of Egg '<EggId>' will be irrevocably overwritten.
        - the overwrite prompt then continues with Input 'c' to confirm or anything else to abort. and Your input:
        - declining that confirmation prints Operation aborted.
        - the overwrite-abort path ends with one trailing blank line
      type_prompt_behavior:
        - if the addressed slot is empty, Passbird prompts with Enter Protein Type or just press enter to abort:
        - if the addressed slot already has a Type '<CurrentType>', Passbird prompts with Enter new Protein Type to replace '<CurrentType>' or just press enter to keep it:
        - on an empty slot, empty type input prints Operation aborted.
        - on an occupied slot, empty type input keeps the existing Protein Type and continues to the structure prompt
      structure_prompt_behavior:
        - after type selection, Passbird prompts with Enter Protein Structure or just press enter to abort:
        - the structure prompt is received either through secure-input handling or regular visible input according to the effective mode determined for this command
        - empty structure input prints Operation aborted.
        - every structure-abort path ends with one trailing blank line
      success_behavior:
        - if the slot was previously empty, successful storage triggers the event output Protein '<Type>' for egg '<EggId>' successfully created.
        - if the slot was previously occupied and the Type stays unchanged, successful storage triggers the event output Protein '<Type>' at slot <SlotIndex> for egg '<EggId>' successfully updated.
        - if the slot was previously occupied and the Type changes, successful storage triggers the event output Protein for egg '<EggId>' at slot <SlotIndex> successfully updated from '<OldType>' to '<NewType>'.
        - the success path ends with one trailing blank line
  - id: get_protein
    commands:
      - p[0-9][EggId]
    user_experience:
      successful_copy:
        - the addressed slot index selects the Protein Structure to copy, with 0 addressing the default Protein slot
        - on successful clipboard update of a non-empty Protein Structure, Passbird prints Protein copied to clipboard.
        - after a successful copy, the command ends with one trailing blank line
      missing_or_empty_targets:
        - if the Egg does not exist, Passbird does not attempt a clipboard update
        - a missing Egg triggers the standard event output Egg '<EggId>' not found.
        - the missing-Egg event also triggers the warning sound defined in specs/interaction.yaml
        - if the Egg exists but the addressed Protein Structure is empty, Passbird prints Specified Protein Structure is empty - Operation aborted.
        - the empty-Structure abort uses the operation-aborted formatting defined in specs/interaction.yaml
        - both non-success branches end with one trailing blank line
      clipboard_failure_behavior:
        - if the clipboard adapter rejects the update, this command handler prints no success line
        - with the default clipboard adapter, clipboard failure reporting is delegated to stderr
        - clipboard failure still ends with one trailing blank line
  - id: secure_input_toggle_prompt
    trigger:
      - domain.protein.promptForProteinStructureInputToggle is enabled
    user_experience:
      prompt_variants:
        - if the configured secure protein input mode is enabled, Passbird prompts with Disable secure input for next input? Y/n 
        - if the configured secure protein input mode is disabled, Passbird prompts with Enable secure input for next input? Y/n 
      behavior:
        - the toggle prompt is shown immediately before the Protein Structure prompt and applies only to that next structure input
        - the toggle prompt uses explicit y or Y only
        - explicit y or Y flips the configured secure-input mode for that one structure prompt
        - empty input keeps the current secure-input behavior
        - any other non-y input also keeps the current secure-input behavior
  - id: discard_protein
    command: p-[0-9][EggId]
    user_experience:
      command_scope:
        - the addressed slot index selects the Protein slot to discard, with 0 addressing the default Protein slot
      missing_egg_behavior:
        - the command first checks whether the Egg exists
        - if the Egg does not exist, Passbird does not prompt for confirmation and does not attempt a discard
        - a missing Egg triggers the standard event output Egg '<EggId>' not found.
        - the missing-Egg event also triggers the warning sound defined in specs/interaction.yaml
        - the missing-Egg path ends with one trailing blank line
      empty_slot_behavior:
        - if the Egg exists but the addressed Protein slot is already empty, Passbird performs no confirmation prompt
        - the empty-slot path prints no success line and no abort line of its own
        - the empty-slot path ends with one trailing blank line
      confirmation_behavior:
        - confirmation is only considered when the Egg exists and the addressed Protein slot currently contains a Protein
        - if promptOnRemoval is disabled, Passbird discards the Protein immediately
        - if promptOnRemoval is enabled, Passbird prompts with Discarding a Protein is an irrevocable action.
        - the discard prompt then continues with Input 'c' to confirm or anything else to abort. and Your input:
        - declining that confirmation prints Operation aborted.
        - the confirmation-abort path ends with one trailing blank line
      success_behavior:
        - on successful discard of an existing Protein, Passbird triggers the event output Protein '<Type>' of egg '<EggId>' successfully discarded.
        - the success path ends with one trailing blank line
