schema_version: 1
last_reviewed: 2026-05-25
flow_family: startup_and_session
applies_interaction_rules_from: specs/interaction.yaml
flows:
  - id: normal_boot
    trigger:
      - Passbird starts with a valid home directory and usable local state
    exact_sequence:
      - the normal application boot path emits one empty line before any startup-specific prompt or command prompt
      - Passbird moves to the initial Nest from the run context before entering the steady-state command loop
      - startup initializers run before the first Enter command: prompt is shown
    visible_rules:
      - there is no welcome banner or startup summary in the normal boot path itself
      - if no initializer emits user-visible output, the first visible steady-state content after the opening empty line is the command prompt
      - startup trash cleanup runs before the first command prompt
      - if startup trash cleanup permanently discards at least one Egg, Passbird first prints Discarding Eggs from trash. and then the per-Egg discard event lines
      - if startup trash cleanup does not discard any Eggs, it produces no user-visible output of its own
  - id: invalid_initial_nest_slot
    trigger:
      - Passbird starts with a valid home directory and a second CLI argument outside Nest Slots 1 through 9
    exact_visible_behavior:
      - Passbird prints Shutting down: Specified initial Nest Slot is not supported: <ArgumentValue>.
      - Passbird terminates without entering the application boot path or command loop
  - id: export_file_reminder
    trigger:
      - application.exchange.promptOnExportFile is enabled and passbird-export.json exists at startup
    exact_prompt: "An password export file has been detected. Should this file be deleted? Y/n "
    accepted_inputs:
      - y
      - Y
    rejected_as_affirmative:
      - empty input
      - n
      - any other non-y input
    exact_branches:
      - on explicit y or Y, Passbird deletes passbird-export.json and then prints Export file has been successfully deleted.
      - on any non-affirmative input, Passbird keeps passbird-export.json and then prints Export file has not been deleted but prompt for deletion will be repeated upon next program start.
    spacing_rules:
      - after either branch, Passbird emits one empty line before the next output or command prompt
    observable_rules:
      - the reminder is shown at most once per startup run
      - if the file does not exist, or prompting is disabled in configuration, this flow produces no output
  - id: command_loop
    trigger:
      - startup initializers have completed
    exact_prompt_when_default_nest: "Enter command: "
    exact_prompt_when_non_default_nest: "[<CurrentNestId>] Enter command: "
    prompt_rules:
      - the Nest prefix is omitted for the default Nest
      - the Nest prefix includes square brackets around the current NestId followed by one trailing space
      - the prompt is written without a newline so user input continues on the same line
      - each command flow is responsible for its own result output and spacing before the next prompt appears
    exit_rule:
      - a raw interrupt character entered as the command with no trailing data ends the loop without extra output from PassbirdApplication itself
      - this raw interrupt path bypasses the quit command handler, finalizers, inactivity hint, and farewell block
      - if stdin reaches EOF before the next command line starts, Passbird ends the loop without extra output from PassbirdApplication itself
  - id: inactivity_and_quit
    trigger:
      - a running session becomes inactive or the user exits
    inactivity_monitoring_rules:
      - inactivity checking runs only if application.inactivityLimit.enabled is true
      - when enabled, Passbird starts a daemon timer at boot that checks inactivity every 10 seconds
      - the inactivity threshold is exceeded only when elapsed idle time is strictly greater than application.inactivityLimit.limitInMinutes multiplied by 60 seconds
      - each received non-interrupt command input refreshes the last-interaction timestamp before the command handler runs
      - when inactivity is detected while Passbird is blocked in visible or secure terminal input, the timer requests shutdown and the interactive execution path performs the actual quit handling once control returns from the input adapter
    user_quit_command:
      accepted_command_shape:
        - q
      rejected_command_shapes:
        - any additional command characters after q
        - any trailing argument data after q
      exact_parse_failure_behavior:
        - parse rejection happens before the quit handler starts
        - on parse rejection, Passbird performs no finalizer run and no process exit
        - parse rejection is reported to standard error as Command execution failed: Parameter for command 'q' not supported: <UnsupportedParameter>
      exact_visible_behavior:
        - on accepted q, Passbird runs finalizers before printing the farewell block
        - in the current product, the registered quit finalizer path does not emit user-visible output of its own
        - after finalization, Passbird emits one empty line
        - Passbird then prints exactly three farewell lines followed by one empty line
      farewell_block_format:
        - "  -,     <FarewellLine1>"
        - " ( '<    <FarewellLine2>"
        - "/ ) )    <FarewellLine3>"
      exact_farewell_triplets:
        - line1: "Fly safe, my feathered friends,"
          line2: "and guard those passwords with"
          line3: "the strength of a soaring eagle."
        - line1: "May the winds of security carry"
          line2: "you far, and may your nests"
          line3: "remain impervious to prying eyes."
        - line1: "Tweet farewell to the passwords,"
          line2: "my little hatchlings, and may they stay"
          line3: "encrypted in the skies of cyberspace."
        - line1: "Feathered guardians, it's time to spread"
          line2: "your wings and protect the digital secrets"
          line3: "entrusted to your nests. Farewell!"
        - line1: "Fly high, passwords snug in your eggshells,"
          line2: "and may your cryptographic codes remain"
          line3: "uncrackable in the vast password skies."
        - line1: "Flutter away, my password-protected eggs,"
          line2: "and may your encryption be as unyielding"
          line3: "as the oak branches that cradle you."
        - line1: "Take flight, my avian keepers of security,"
          line2: "and may the passwords you guard be"
          line3: "as elusive as the clouds you soar through."
        - line1: "Soar into the sunset, my egg-bound sentinels,"
          line2: "and let the passwords within your shells"
          line3: "remain as mysterious as the night sky."
        - line1: "Wing your way into the horizon, passwords nestled"
          line2: "in your egg-shaped sanctuaries, and may your security"
          line3: "be as steadfast as a vigilant owl."
        - line1: "As you take to the skies, remember to keep"
          line2: "those passwords safe and sound, for the"
          line3: "digital realm relies on your watchful wings."
        - line1: "Fly on, password protectors, and may"
          line2: "the clouds of encryption surround"
          line3: "you in a cloak of digital secrecy."
        - line1: "Wishing you tailwinds and uncrackable codes as you"
          line2: "carry the passwords to their secure destinations."
          line3: "Farewell, my avian custodians."
        - line1: "Spread your wings, guardians of access, and let"
          line2: "the passwords you shelter remain as elusive"
          line3: "as the dance of sunlight on rippling waters."
        - line1: "May your nests be resilient, and your passwords"
          line2: "resilient still. Farewell, feathered keepers"
          line3: "of the keys to the digital realm."
        - line1: "As you take flight, may the passwords"
          line2: "in your care be as well-protected"
          line3: "as the jewels in the crown of the sky."
        - line1: "Sail into the azure expanse, my egg-borne"
          line2: "custodians, and let the passwords within your"
          line3: "shells be as secure as a fortress in the clouds."
        - line1: "Fly gracefully, my aerial stewards of security,"
          line2: "and may the passwords under your vigilant wings"
          line3: "remain impervious to the storms of cyber threats."
        - line1: "Wishing you clear skies and encrypted horizons,"
          line2: "my password-keeping companions. Until we meet again,"
          line3: "soar high and keep the digital keys safe."
        - line1: "May the currents of the digital winds guide"
          line2: "you to safeguard the passwords, and may your"
          line3: "nests be a haven of unbreakable defenses. Farewell!"
        - line1: "Take flight, my encrypted messengers, and may"
          line2: "the passwords within your eggs be as well-protected"
          line3: "as the ancient secrets whispered by the wind."
      farewell_content_rules:
        - the three FarewellLine values are chosen together as one random farewell triplet from the exact built-in farewell set listed here
        - user-triggered quit does not print the inactivity hint
      termination_rule:
        - after the farewell block, Passbird terminates the process
    inactivity_termination:
      trigger:
        - the inactivity monitor detects elapsed idle time above the configured threshold
      exact_visible_behavior:
        - Passbird resumes the interactive execution path and then posts the same quit path with quit reason INACTIVITY
        - because inactivity termination happens while the command prompt is already open, Passbird first ends the prompt line
        - Passbird then emits one empty line
        - Passbird prints Terminating Passbird due to inactivity.
        - Passbird emits one empty line after the inactivity hint
        - Passbird then prints the same three-line farewell block used for user-triggered quit
        - Passbird emits one empty line after the farewell block and then terminates the process
      observable_rules:
        - inactivity termination requires no confirmation
        - the inactivity hint appears only for quit reason INACTIVITY
        - the same finalizers run before the inactivity hint and farewell block
        - a raw interrupt character does not use this quit flow
