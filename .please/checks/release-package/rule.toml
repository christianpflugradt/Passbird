id = "release-package"
description = "Package the versioned and tested JAR"
run_at = ["release-candidate"]
depends_on = ["format", "static-analysis", "compile", "tests", "coverage", "dependency-license", "native-smoke", "agent-specs"]

[check]
command = "python3 scripts/release-artifacts.py package"
timeout_seconds = 900
resource = "gradle"
