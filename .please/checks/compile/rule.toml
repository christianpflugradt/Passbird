id = "compile"
version = "1.0"
name = "Compilation"
description = "Production and test sources compile against the Java 17 APIs"
run_at = ["pre-push", "check"]

[check]
command = "sh tools/gradle-check.sh compileKotlin compileTestKotlin compileJava compileTestJava"
timeout_seconds = 1800
resource = "gradle"
