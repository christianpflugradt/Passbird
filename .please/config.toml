project = "Passbird"
max_display_files = 5

[execution]
fail_fast_terminate_running_instances = false

[execution_points]
custom = ["release"]

[[imports]]
git = "https://github.com/christianpflugradt/please-behave-governance.git"
path = "rulesets/commit-msg/repository-conventions"
ref = "c4d4c60eff8fc5d32641f5fe33b5cfa9e337e1f3"

[imports.rule_parameters.commit-message]
scopes_file = ".please/commit-scopes.txt"

[[imports]]
git = "https://github.com/christianpflugradt/please-behave-governance.git"
path = "rulesets/multi-point/security"
ref = "c4d4c60eff8fc5d32641f5fe33b5cfa9e337e1f3"

[[imports]]
git = "https://github.com/christianpflugradt/please-behave-governance.git"
path = "rulesets/multi-point/open-source-software"
ref = "c4d4c60eff8fc5d32641f5fe33b5cfa9e337e1f3"

[imports.rule_parameters.license]
target = "LICENSE"

[[provider_imports]]
id = "gemini-flash-lite"
git = "https://github.com/christianpflugradt/please-behave-governance.git"
path = "providers/gemini-flash-lite"
ref = "c4d4c60eff8fc5d32641f5fe33b5cfa9e337e1f3"
