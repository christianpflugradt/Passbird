include = [
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/repository-conventions/mise.toml?ref=29f7071f4b285c228ea4206693a5c397f693a966",
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/security/mise.toml?ref=356256b67beed2419a0691611bb71aa3736c326e",
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/open-source-software/mise.toml?ref=356256b67beed2419a0691611bb71aa3736c326e",
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/releasable-open-source-software/mise.toml?ref=247434c51b05ace2163a53887595dd1eaa701fdf",
]

[task_config]
includes = [
  "git::https://github.com/christianpflugradt/repository-catalog.git//mise-tasks/release?ref=c13b67c59b7ab4224fb2544a2de6fa2f49d36e2f",
]

[tools]
"github:please-behave/cli" = "0.25.0"
java = "temurin-25.0.4+7.0.LTS"
node = "26.13.1"
python = "3.15.2"
gh = "2.105.0"
ruff = "0.17.5"
"aqua:boyter/scc" = "4.1.0"

[tasks.format]
description = "Format Kotlin, Python and shell sources"
run = [
  "./gradlew ktlintFormat",
  "ruff format",
  "git ls-files -z '*.sh' | xargs -0 -r shfmt -w",
]

[tasks.verify]
description = "Run the deterministic pre-push checks and stop at the first blocker"
run = "please run --at pre-push --checks-only --fail-fast"

[tasks.preview]
description = "Publish a preview build"
run = "./gradlew publishPreview"

[tasks.setup]
description = "Fetch locked dependencies and warm the Gradle task graph for offline Git hooks and CI"
run = "sh tools/prepare.sh"

[tasks."setup:candidate"]
description = "Fetch locked dependencies for the release candidate build"
run = "sh tools/prepare.sh candidate"

[tasks.build]
description = "Build the executable JAR with prepared dependencies"
run = "sh tools/gradle-check.sh jar"
