[tools]
"github:please-behave/cli" = "0.9.0"
java = "temurin-25.0.4+101.0.LTS"
node = "26.13.0"
python = "3.15.2"
actionlint = "1.7.12"
yq = "4.54.3"
gitleaks = "8.30.1"
shellcheck = "0.11.0"
gh = "2.103.3"
ruff = "0.17.4"
shfmt = "3.14.1"

[tasks.format]
description = "Format Kotlin, Python and shell sources"
run = [
  "./gradlew ktlintFormat",
  "ruff format",
  "git ls-files -z '*.sh' | xargs -0 grep -L '^#!.*zsh' | xargs shfmt -w",
]

[tasks.verify]
description = "Run the deterministic pre-push checks and stop at the first blocker"
run = "please run --at pre-push --checks-only --fail-fast"

[tasks.preview]
description = "Publish a preview build"
run = "./gradlew publishPreview"

[tasks.prepare]
description = "Fetch locked dependencies and warm the Gradle task graph for offline Git hooks and CI"
run = "bash tools/prepare.sh"

[tasks.build]
description = "Build the executable JAR with prepared dependencies"
run = "bash tools/gradle-check.sh jar"

[tasks.package]
description = "Package the verified versioned JAR without rebuilding"
run = "python3 .github/scripts/release-artifacts.py package"

[tasks.release]
description = "Start the Release workflow for remote main"
run = "gh workflow run release.yml --ref main"
