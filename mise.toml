[tools]
"github:please-behave/cli" = "0.5.1"
java = "temurin-25.0.4+101.0.LTS"
node = "26.13.0"
python = "3.15.2"
actionlint = "1.7.12"
gitleaks = "8.30.1"
shellcheck = "0.11.0"

[tasks.format]
run = "./gradlew ktlintFormat"

[tasks.verify]
run = "please run --at pre-push --checks-only"

[tasks.preview]
run = "./gradlew publishPreview"


[tasks."ci:prepare"]
alias = "prepare"
run = "bash scripts/prepare.sh"

[tasks."hooks:install"]
alias = "install-git-hooks"
run = "sh scripts/setup-git-hooks.sh --yes"

[tasks.build]
description = "Build the executable JAR with prepared dependencies"
run = "bash scripts/gradle-check.sh jar"

[tasks.package]
description = "Package the verified versioned JAR without rebuilding"
run = "python3 scripts/release-artifacts.py package"

[tasks.release]
description = "Start the Release workflow for remote main"
run = "gh workflow run release.yml --ref main"
