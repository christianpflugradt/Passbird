[tools]
java = "temurin-25.0.4+101.0.LTS"
node = "26.13.0"
python = "3.15.2"
actionlint = "1.7.12"
gitleaks = "8.30.1"
shellcheck = "0.11.0"

[tasks.format]
run = "./gradlew ktlintFormat"

[tasks.verify]
run = "please run --at pre-push --checks-only"

[tasks.preview]
run = "./gradlew publishPreview"


[tasks.prepare]
run = "bash scripts/prepare.sh"

[tasks.install-git-hooks]
run = "sh scripts/setup-git-hooks.sh --yes"
