name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    uses: christianpflugradt/repository-catalog/.github/workflows/ci-check.yml@2b098709773d0de78f6d03b597c03b15eff6e2d5 # updates/workflows/ci
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
      GATEWAY_KEY: ${{ secrets.GATEWAY_KEY }}
