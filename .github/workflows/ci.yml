name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    permissions:
      contents: read
      id-token: write
    uses: christianpflugradt/repository-catalog/.github/workflows/ci-check.yml@eb70e1fee21c5bff98d2a0c067f344a12c60c8c7 # updates/workflows/ci
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
