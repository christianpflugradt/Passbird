name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    uses: christianpflugradt/please-behave-governance/.github/workflows/ci-check.yml@ba1c41b9392fea57b14df4f6b6281d3b01946f30 # updates/workflows/ci
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
      GATEWAY_KEY: ${{ secrets.GATEWAY_KEY }}
