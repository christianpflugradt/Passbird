name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    uses: christianpflugradt/repository-catalog/.github/workflows/ci-check.yml@52f75f8c81b611b346a64c0d8d0c11f3ed124de1 # updates/workflows/ci
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
      GATEWAY_KEY: ${{ secrets.GATEWAY_KEY }}
