name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    permissions:
      contents: read
      id-token: write
    uses: christianpflugradt/repository-catalog/.github/workflows/ci-check.yml@4c913ce5bb1707e82bf98ba189fd0460c45fdb05 # updates/workflows/ci
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
