name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  MISE_AUTO_INSTALL: 'false'
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  DEPENDENCY_CHECK_DATA_LOCATION: "${{ github.workspace }}/.dependency-check"
  DEPENDENCY_CHECK_CACHE_KEY_PREFIX: linux-dependency-check-v1-
jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Prepare desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xauth xclip xvfb
      - name: Fetch locked dependencies
        run: mise run ci:prepare
      - id: dependency-check-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA_LOCATION }}
          key: ${{ env.DEPENDENCY_CHECK_CACHE_KEY_PREFIX }}build-${{ github.run_id }}
          restore-keys: |
            ${{ env.DEPENDENCY_CHECK_CACHE_KEY_PREFIX }}
      - name: Start virtual display
        run: |
          display_file="$RUNNER_TEMP/please-xvfb-display"
          Xvfb -displayfd 3 -screen 0 1280x1024x24 -nolisten tcp 3>"$display_file" &
          for _ in {1..50}; do
            if [ -s "$display_file" ]; then
              echo "DISPLAY=:$(cat "$display_file")" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 0.1
          done
          echo "::error::Virtual display did not become ready" >&2
          exit 1
      - name: Run quality checks
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          OSS_INDEX_USERNAME: ${{ secrets.OSS_INDEX_USERNAME }}
          OSS_INDEX_PASSWORD: ${{ secrets.OSS_INDEX_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        uses: please-behave/action@196e1d61f898e0cb77c58ab3dd6667f021321d5e # v1.3.0
        with:
          install: 'false'
          sync: 'true'
          execution-point: check
          summary: 'true'
      - name: Bind CI JAR to source and producing attempt
        run: python3 .github/scripts/release-artifacts.py ci-receipt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-jar
          path: build/ci-release-jar
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: quality-check
          path: .please/reports/last.json
          include-hidden-files: true
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/jacoco/
            build/reports/jacoco/
            build/reports/dependency-verification/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ktlint-reports
          path: build/reports/ktlint/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: detekt-reports
          path: build/reports/detekt/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: dependencies-without-allowed-license
          path: build/reports/dependency-license/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mutation-report
          path: build/reports/pitest/*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mutation-line-coverage
          path: build/reports/pitest/linecoverage.xml
          if-no-files-found: ignore
