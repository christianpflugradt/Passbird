name: Purge OWASP Cache
run-name: "Purge OWASP cache (${{ github.event_name }})"

on:
    # GitHub Actions cron uses UTC. 03:00 UTC Monday is 05:00 in Europe/Berlin during DST and 04:00 in winter.
    schedule: [ cron: "0 3 * * 1" ]
    workflow_dispatch:

env:
  DEPENDENCY_CHECK_DATA_LOCATION: "${{ github.workspace }}/.dependency-check"
  DEPENDENCY_CHECK_CACHE_KEY_PREFIX: "linux-dependency-check-v1-"

jobs:

  purge-cache:
    concurrency:
      group: dependency-check-maintenance
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - id: dependency-check-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA_LOCATION }}
          key: ${{ env.DEPENDENCY_CHECK_CACHE_KEY_PREFIX }}purge-${{ github.run_id }}
          restore-keys: |
            ${{ env.DEPENDENCY_CHECK_CACHE_KEY_PREFIX }}
      - name: purge and rebuild dependency-check cache
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          DEPENDENCY_CHECK_DATA_LOCATION: ${{ env.DEPENDENCY_CHECK_DATA_LOCATION }}
          OSS_INDEX_USERNAME: ${{ secrets.OSS_INDEX_USERNAME }}
          OSS_INDEX_PASSWORD: ${{ secrets.OSS_INDEX_PASSWORD }}
        run: |
          ./gradlew dependencyCheckPurge --stacktrace
          rm -rf "$DEPENDENCY_CHECK_DATA_LOCATION"
          ./gradlew dependencyCheckUpdate --stacktrace
      - name: save rebuilt dependency-check cache
        uses: actions/cache/save@v5
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA_LOCATION }}
          key: ${{ steps.dependency-check-cache.outputs.cache-primary-key }}
