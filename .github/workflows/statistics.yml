name: Statistics
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  collect:
    name: Collect statistics
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - name: Prepare dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xauth xclip xvfb
          bash tools/prepare.sh statistics
      - name: Calculate and verify coverage independently
        run: xvfb-run -a bash tools/gradle-check.sh allTests jacocoTestCoverageVerification jacocoTestReport
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-coverage-report
          path: build/reports/jacoco/test
          retention-days: 7
          if-no-files-found: error
      - name: Write coverage metrics
        run: python3 .github/scripts/write-coverage-metrics.py build/reports/jacoco/test/jacocoTestReport.xml build/statistics
      - name: Upload coverage metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-metrics
          path: build/statistics
          if-no-files-found: error

      - name: Upload coverage failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-diagnostics
          path: |
            build/reports/dependency-verification/
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore

  publish:
    name: Publish statistics
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - collect
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download metrics
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-metrics
          path: metrics

      - name: Send statistics to badges-and-stuff
        env:
          GH_TOKEN: ${{ secrets.STATISTICS_TOKEN }}
        run: |
          set -euo pipefail
          jq --slurp \
            --arg project passbird \
            --arg commit "$GITHUB_SHA" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{event_type: "statistics", client_payload: {project: $project, commit: $commit, timestamp: $timestamp, metrics: .}}' \
            metrics/*.json >payload.json
          gh api --method POST repos/christianpflugradt/badges-and-stuff/dispatches --input payload.json
