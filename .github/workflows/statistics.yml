name: Statistics
on:
  push:
    branches: [main]
permissions:
  contents: read
env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  collect:
    name: Collect statistics
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - name: Install pinned scc
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: aqua:boyter/scc
          experimental: true
          version: 2026.11.11
      - name: Prepare dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xauth xclip xvfb
          sh tools/prepare.sh statistics
      - name: Calculate and verify coverage independently
        run: xvfb-run -a sh tools/gradle-check.sh allTests jacocoTestCoverageVerification jacocoTestReport
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-coverage-report
          path: build/reports/jacoco/test
          retention-days: 7
          if-no-files-found: error
      - name: Write coverage metrics
        run: python3 .github/scripts/write-coverage-metrics.py build/reports/jacoco/test/jacocoTestReport.xml build/statistics
      - name: Write lines of code and test count metrics
        run: |
          scc --format json --include-ext kt src/main >build/scc.json
          python3 .github/scripts/write-count-metrics.py build/scc.json build/test-results/allTests build/statistics
      - name: Upload statistics metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: statistics-metrics
          path: build/statistics
          if-no-files-found: error

      - name: Upload coverage failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-diagnostics
          path: |
            build/reports/dependency-verification/
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore

  publish:
    name: Publish statistics
    needs:
      - collect
    if: github.ref == 'refs/heads/main'
    uses: christianpflugradt/repository-catalog/.github/workflows/statistics-publish.yml@19e626fc8f927a8d909d6d7c11761096294b22c0 # updates/workflows/statistics
    with:
      project: passbird
    secrets:
      STATISTICS_TOKEN: ${{ secrets.STATISTICS_TOKEN }}
