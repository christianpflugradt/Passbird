name: Build and Verify

on:
    push:
      branches-ignore:
        - gh-pages
    workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  DEPENDENCY_CHECK_DATA_LOCATION: "${{ github.workspace }}/.dependency-check"
  DEPENDENCY_CHECK_CACHE_KEY_PREFIX: "linux-dependency-check-v1-"
  PAGES_BRANCH: "gh-pages"

jobs:

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - name: compile code
        run: ./gradlew compileKotlin compileTestKotlin compileJava compileTestJava
      - uses: actions/upload-artifact@v7
        with:
          name: compile
          path: build

  ktlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: lint code
        run: ./gradlew ktlintCheck
      - uses: actions/upload-artifact@v7
        with:
          name: ktlint-reports
          path: build/reports/ktlint/*

  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: check licenses
        run: ./gradlew checkLicense
      - name: upload failed license check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependencies-without-allowed-license
          path: build/reports/dependency-license/dependencies-without-allowed-license.json

  owasp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - id: dependency-check-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA_LOCATION }}
          key: ${{ env.DEPENDENCY_CHECK_CACHE_KEY_PREFIX }}build-${{ github.run_id }}
          restore-keys: |
            ${{ env.DEPENDENCY_CHECK_CACHE_KEY_PREFIX }}
      - id: dependency-check-mirror
        name: resolve dependency-check mirror
        run: |
          base_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/Passbird/odc"
          if curl --silent --fail --head "${base_url}/nvd/nvdcve-modified.meta" >/dev/null; then
            echo "nvd_datafeed_url=${base_url}/nvd/nvdcve-{0}.json.gz" >> "$GITHUB_OUTPUT"
            echo "kev_url=${base_url}/known_exploited_vulnerabilities.json" >> "$GITHUB_OUTPUT"
            echo "hosted_suppressions_url=${base_url}/publishedSuppressions.xml" >> "$GITHUB_OUTPUT"
          fi
      - name: check dependencies for vulnerabilities
        env:
          DEPENDENCY_CHECK_DATA_LOCATION: ${{ env.DEPENDENCY_CHECK_DATA_LOCATION }}
          DEPENDENCY_CHECK_NVD_DATAFEED_URL: ${{ steps.dependency-check-mirror.outputs.nvd_datafeed_url }}
          DEPENDENCY_CHECK_KEV_URL: ${{ steps.dependency-check-mirror.outputs.kev_url }}
          DEPENDENCY_CHECK_HOSTED_SUPPRESSIONS_URL: ${{ steps.dependency-check-mirror.outputs.hosted_suppressions_url }}
          OSS_INDEX_USERNAME: ${{ secrets.OSS_INDEX_USERNAME }}
          OSS_INDEX_PASSWORD: ${{ secrets.OSS_INDEX_PASSWORD }}
        run: ./gradlew dependencyCheckAnalyze --stacktrace
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.html

  unit-tests:
    runs-on: ubuntu-latest
    needs: [ compile ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          name: compile
          path: build
      - name: run unit tests
        run: ./gradlew test
      - uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: build/reports/tests/test/*
      - uses: actions/upload-artifact@v7
        with:
          name: unit-test-execution-data
          path: build/jacoco/test.exec

  integration-tests:
    runs-on: ubuntu-latest
    needs: [ compile ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          name: compile
          path: build
      - name: run integration tests
        run: ./gradlew integration
      - uses: actions/upload-artifact@v7
        with:
          name: integration-test-report
          path: build/reports/tests/integration/*
      - uses: actions/upload-artifact@v7
        with:
          name: integration-test-execution-data
          path: build/jacoco/integration.exec

  architecture-tests:
    runs-on: ubuntu-latest
    needs: [ compile ]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          name: compile
          path: build
      - name: run architecture tests
        run: ./gradlew architecture
      - uses: actions/upload-artifact@v7
        with:
          name: architecture-test-report
          path: build/reports/tests/architecture/*

  test-coverage-verification:
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
      - architecture-tests
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          name: compile
          path: build
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-test-execution-data"
          path: build/jacoco
          merge-multiple: true
      - name: verify code coverage
        run: ./gradlew --no-build-cache jacocoTestCoverageVerification

  test-coverage-report:
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
      - architecture-tests
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          name: compile
          path: build
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-test-execution-data"
          path: build/jacoco
          merge-multiple: true
      - name: create code coverage report
        run: ./gradlew --no-build-cache jacocoTestReport
      - uses: actions/upload-artifact@v7
        with:
          name: test-coverage-report
          path: build/reports/jacoco/test

  pages-site:
    runs-on: ubuntu-latest
    needs:
      - test-coverage-verification
      - test-coverage-report
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: build GitHub Pages site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: prepare writable Pages directory
        run: |
          rm -rf site
          mkdir -p site
          cp -R _site/. site/
      - uses: actions/download-artifact@v8
        with:
          name: test-coverage-report
          path: build/reports/jacoco/test
      - name: add coverage assets to Pages site
        run: |
          report_xml="build/reports/jacoco/test/jacocoTestReport.xml"
          branch_counter="$(grep -o '<counter type=\"BRANCH\" missed=\"[0-9]*\" covered=\"[0-9]*\"/>' "$report_xml" | tail -n1)"
          missed="$(printf '%s\n' "$branch_counter" | sed -E 's/.*missed=\"([0-9]+)\".*/\1/')"
          covered="$(printf '%s\n' "$branch_counter" | sed -E 's/.*covered=\"([0-9]+)\".*/\1/')"
          total=$((missed + covered))
          percentage_tenths="$(awk -v covered="$covered" -v total="$total" 'BEGIN { if (total == 0) print 0; else printf "%.0f", (covered * 1000) / total }')"
          if [ $((percentage_tenths % 10)) -eq 0 ]; then
            percentage="$((percentage_tenths / 10))%"
          else
            percentage="$((percentage_tenths / 10)).$((percentage_tenths % 10))%"
          fi

          if [ "$percentage_tenths" -lt 500 ]; then
            color="e05d44"
          elif [ "$percentage_tenths" -lt 700 ]; then
            color="fe7d37"
          elif [ "$percentage_tenths" -lt 850 ]; then
            color="dfb317"
          elif [ "$percentage_tenths" -lt 900 ]; then
            color="97ca00"
          else
            color="4c1"
          fi

          mkdir -p site/coverage
          rm -rf site/coverage/report
          cp -R build/reports/jacoco/test/html site/coverage/report
          cat > site/coverage/branch-coverage.json <<EOF
          {
            "schemaVersion": 1,
            "label": "branch coverage",
            "message": "$percentage",
            "color": "$color"
          }
          EOF
      - name: restore mirrored dependency-check assets
        run: |
          if git ls-remote --exit-code --heads origin "$PAGES_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$PAGES_BRANCH" --depth=1
            pages_worktree="$(mktemp -d)"
            git worktree add "$pages_worktree" "origin/$PAGES_BRANCH"
            if [ -d "$pages_worktree/odc" ]; then
              rsync -a "$pages_worktree/odc/" site/odc/
            fi
            git worktree remove "$pages_worktree" --force
          fi
      - name: store current Pages snapshot
        run: |
          if git ls-remote --exit-code --heads origin "$PAGES_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$PAGES_BRANCH" --depth=1
          fi
          pages_worktree="$(mktemp -d)"
          git worktree add --detach "$pages_worktree"
          (
            cd "$pages_worktree"
            if git show-ref --verify --quiet "refs/remotes/origin/$PAGES_BRANCH"; then
              git checkout -B "$PAGES_BRANCH" "origin/$PAGES_BRANCH"
            else
              git checkout --orphan "$PAGES_BRANCH"
              git rm -rf . >/dev/null 2>&1 || true
            fi
          )
          rsync -a --delete --exclude '.git' --exclude '.git/' site/ "$pages_worktree/"
          touch "$pages_worktree/.nojekyll"
          (
            cd "$pages_worktree"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "ci: update github pages snapshot"
              git push origin HEAD:"$PAGES_BRANCH"
            fi
          )
          git worktree remove "$pages_worktree" --force
      - name: upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy-pages:
    runs-on: ubuntu-latest
    needs: pages-site
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
