name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  DEPENDENCY_CHECK_DATA_LOCATION: "${{ github.workspace }}/.dependency-check"
  DEPENDENCY_CHECK_CACHE_KEY_PREFIX: linux-dependency-check-v1-
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache: false
      - name: Prepare validation tools and project dependencies
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          sudo apt-get update
          sudo apt-get install --yes shellcheck xauth xclip xvfb
          bash scripts/prepare.sh check
      - name: Read governor pin
        id: governor
        run: echo "version=$(cat .please-version)" >> "$GITHUB_OUTPUT"
      - uses: please-behave/action@3f726664f6a18193ac1bfa0f542e34ba76f24523 # v1.1.1
        with:
          version: ${{ steps.governor.outputs.version }}
          run: 'false'
      - run: please sync --yes
      - name: Run quality checks
        run: xvfb-run -a please run --at check --checks-only
      - name: Bind CI JAR to source and producing attempt
        run: python3 scripts/release-artifacts.py ci-receipt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-jar
          path: build/ci-release-jar
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: quality-check
          path: .please/reports/last.json
          include-hidden-files: true
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/jacoco/
            build/reports/jacoco/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ktlint-reports
          path: build/reports/ktlint/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: detekt-reports
          path: build/reports/detekt/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: dependencies-without-allowed-license
          path: build/reports/dependency-license/dependencies-without-allowed-license.json
          if-no-files-found: ignore
  owasp:
    name: OWASP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - id: dependency-check-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA_LOCATION }}
          key: ${{ env.DEPENDENCY_CHECK_CACHE_KEY_PREFIX }}build-${{ github.run_id }}
          restore-keys: |
            ${{ env.DEPENDENCY_CHECK_CACHE_KEY_PREFIX }}
      - name: Prepare dependency inputs
        run: ./gradlew --no-configuration-cache prepareValidationDependencies
      - name: check dependencies for vulnerabilities
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          DEPENDENCY_CHECK_DATA_LOCATION: ${{ env.DEPENDENCY_CHECK_DATA_LOCATION }}
          OSS_INDEX_USERNAME: ${{ secrets.OSS_INDEX_USERNAME }}
          OSS_INDEX_PASSWORD: ${{ secrets.OSS_INDEX_PASSWORD }}
        run: ./gradlew --no-configuration-cache dependencyCheckAnalyze --stacktrace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.html

  mutation-tests:
    name: Mutation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare dependencies
        run: ./gradlew --no-configuration-cache prepareValidationDependencies
      - name: Run mutation tests
        run: ./gradlew --offline mutation --stacktrace --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mutation-report
          path: build/reports/pitest/*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mutation-line-coverage
          path: build/reports/pitest/linecoverage.xml
          if-no-files-found: ignore

  artifact-smoke-test:
    name: artifact-smoke-test (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    needs: [ check ]
    strategy:
      fail-fast: false
      matrix:
        java-version: [ '17', '21', '25' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
      - name: install smoke test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xauth xclip xvfb
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-jar
          path: build/libs
      - name: smoke-validate release jar
        run: |
          rm -rf "build/smoke-test-ci-java-${{ matrix.java-version }}"
          xvfb-run -a env PASSBIRD_JAR="$GITHUB_WORKSPACE/build/libs/passbird.jar" PASSBIRD_SMOKE_TMPDIR="$GITHUB_WORKSPACE/build/smoke-test-ci-java-${{ matrix.java-version }}" PASSBIRD_SMOKE_KEEP_TMP=1 ./smoke-test/run.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: jar-smoke-test-artifacts-java-${{ matrix.java-version }}
          path: build/smoke-test-ci-java-${{ matrix.java-version }}
          if-no-files-found: ignore
