name: Build and Verify

on:
    push:
    workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - name: compile code
        run: ./gradlew compileKotlin compileTestKotlin compileJava compileTestJava
      - uses: actions/upload-artifact@v7
        with:
          name: compile
          path: build

  ktlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: lint code
        run: ./gradlew ktlintCheck
      - uses: actions/upload-artifact@v7
        with:
          name: ktlint-reports
          path: build/reports/ktlint/*

  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: check licenses
        run: ./gradlew checkLicense
      - name: upload failed license check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependencies-without-allowed-license
          path: build/reports/dependency-license/dependencies-without-allowed-license.json

  unit-tests:
    runs-on: ubuntu-latest
    needs: [ compile ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          name: compile
          path: build
      - name: run unit tests
        run: ./gradlew test
      - uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: build/reports/tests/test/*
      - uses: actions/upload-artifact@v7
        with:
          name: unit-test-execution-data
          path: build/jacoco/test.exec

  integration-tests:
    runs-on: ubuntu-latest
    needs: [ compile ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          name: compile
          path: build
      - name: run integration tests
        run: ./gradlew integration
      - uses: actions/upload-artifact@v7
        with:
          name: integration-test-report
          path: build/reports/tests/integration/*
      - uses: actions/upload-artifact@v7
        with:
          name: integration-test-execution-data
          path: build/jacoco/integration.exec

  architecture-tests:
    runs-on: ubuntu-latest
    needs: [ compile ]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          name: compile
          path: build
      - name: run architecture tests
        run: ./gradlew architecture
      - uses: actions/upload-artifact@v7
        with:
          name: architecture-test-report
          path: build/reports/tests/architecture/*

  test-coverage-verification:
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
      - architecture-tests
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          name: compile
          path: build
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-test-execution-data"
          path: build/jacoco
          merge-multiple: true
      - name: verify code coverage
        run: ./gradlew --no-build-cache jacocoTestCoverageVerification

  test-coverage-report:
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
      - architecture-tests
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          name: compile
          path: build
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-test-execution-data"
          path: build/jacoco
          merge-multiple: true
      - name: create code coverage report
        run: ./gradlew --no-build-cache jacocoTestReport
      - uses: actions/upload-artifact@v7
        with:
          name: test-coverage-report
          path: build/reports/jacoco/test

  pages-site:
    runs-on: ubuntu-latest
    needs:
      - test-coverage-verification
      - test-coverage-report
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: build GitHub Pages site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/download-artifact@v8
        with:
          name: test-coverage-report
          path: build/reports/jacoco/test
      - name: add coverage assets to Pages site
        run: |
          python3 scripts/render_coverage_pages.py \
            --report-xml build/reports/jacoco/test/jacocoTestReport.xml \
            --report-html-dir build/reports/jacoco/test/html \
            --site-dir _site
      - name: upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy-pages:
    runs-on: ubuntu-latest
    needs: pages-site
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
