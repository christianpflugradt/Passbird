name: publish
run-name: "publish semantic release (${{ github.event_name }} on ${{ github.ref_name }})"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
      timezone: "Europe/Berlin"

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v6
      - name: build release jar
        run: ./gradlew -PcreatedBy="GitHub Actions" jar
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
      - name: run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes --package semantic-release@24.2.5 --package conventional-changelog-conventionalcommits@9.0.0 semantic-release
