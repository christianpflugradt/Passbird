name: Release
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
      timezone: Europe/Berlin
permissions:
  contents: read
concurrency:
  group: publish
  cancel-in-progress: false
env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'
jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Plan without tagging or publishing
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: npm run release:plan

  release-readiness:
    name: Release Readiness
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      ci_run_id: ${{ steps.evidence.outputs.ci_run_id }}
      ci_attempt: ${{ steps.evidence.outputs.ci_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache: false
      - name: Prepare security scanner
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Read governor pin
        id: governor
        run: echo "version=$(cat .please-version)" >> "$GITHUB_OUTPUT"
      - uses: please-behave/action@722d5967c094e5ac4bfe25e9f82b020ff34e9487 # v1.2.0
        with:
          version: ${{ steps.governor.outputs.version }}
          run: 'false'
      - run: please sync --yes
      - name: Verify exact-source CI and release readiness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        uses: please-behave/action@722d5967c094e5ac4bfe25e9f82b020ff34e9487 # v1.2.0
        with:
          version: ${{ steps.governor.outputs.version }}
          execution-point: release-readiness
          checks-only: 'true'
          summary: 'true'
      - name: Read trusted CI artifact identity from the external proof
        id: evidence
        run: python3 scripts/release-artifacts.py ci-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: release-readiness-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .please/reports/last.json
          include-hidden-files: true
          if-no-files-found: warn

  release-candidate:
    name: Release Candidate
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Prepare candidate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xauth xclip xvfb
          bash scripts/prepare.sh candidate
      - name: Read governor pin
        id: governor
        run: echo "version=$(cat .please-version)" >> "$GITHUB_OUTPUT"
      - uses: please-behave/action@722d5967c094e5ac4bfe25e9f82b020ff34e9487 # v1.2.0
        with:
          version: ${{ steps.governor.outputs.version }}
          run: 'false'
      - run: please sync --yes
      - name: Start virtual display
        run: |
          display_file="$RUNNER_TEMP/please-xvfb-display"
          Xvfb -displayfd 3 -screen 0 1280x1024x24 -nolisten tcp 3>"$display_file" &
          for _ in {1..50}; do
            if [ -s "$display_file" ]; then
              echo "DISPLAY=:$(cat "$display_file")" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 0.1
          done
          echo "::error::Virtual display did not become ready" >&2
          exit 1
      - name: Validate, smoke on Java 25 and package candidate
        uses: please-behave/action@722d5967c094e5ac4bfe25e9f82b020ff34e9487 # v1.2.0
        with:
          version: ${{ steps.governor.outputs.version }}
          execution-point: release-candidate
          checks-only: 'true'
          summary: 'true'
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
      - name: Smoke exact candidate on Java 17
        run: xvfb-run -a bash scripts/smoke-candidate.sh 17
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - name: Smoke exact candidate on Java 21
        run: xvfb-run -a bash scripts/smoke-candidate.sh 21
      - name: Verify complete candidate and smoke evidence
        run: python3 scripts/release-artifacts.py verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: passbird-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: release-candidate-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .please/reports/last.json
            build/reports/
            build/test-results/
            build/smoke-test-candidate-java-*/
          include-hidden-files: true
          if-no-files-found: warn

  publish:
    name: Publish
    needs: [plan, release-readiness, release-candidate]
    if: >-
      needs.plan.outputs.release == 'true' &&
      needs.release-readiness.result == 'success' &&
      needs.release-candidate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_MODE: ${{ needs.plan.outputs.mode }}
      VERIFIED_CI_RUN_ID: ${{ needs.release-readiness.outputs.ci_run_id }}
      VERIFIED_CI_ATTEMPT: ${{ needs.release-readiness.outputs.ci_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: passbird-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-jar
          path: verified-release-jar
          run-id: ${{ needs.release-readiness.outputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Publish exact verified candidate without rebuilding
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: npm run release
