name: Publish Release
run-name: "Semantic release (${{ github.event_name }})"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
      timezone: "Europe/Berlin"

permissions:
  actions: read
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  require-verified-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - id: require-build
        uses: actions/github-script@v8
        with:
          script: |
            const workflowId = "build.yml";
            const branch = "main";
            const sha = context.sha;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              branch,
              status: "completed",
              per_page: 50,
            });

            const successfulRun = data.workflow_runs.find((run) =>
              run.head_sha === sha && run.conclusion === "success"
            );

            if (!successfulRun) {
              core.setFailed(
                `No successful Build and Verify run found for ${sha} on ${branch}. Publish runs are gated on a green build workflow for the current main commit.`
              );
              return;
            }

            core.notice(`Found successful Build and Verify run: ${successfulRun.html_url}`);

  publish:
    needs: [ require-verified-main ]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v6
      - name: build release jar
        run: ./gradlew -PcreatedBy="GitHub Actions" jar
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - name: run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes --package semantic-release@24.2.5 --package conventional-changelog-conventionalcommits@9.0.0 semantic-release
