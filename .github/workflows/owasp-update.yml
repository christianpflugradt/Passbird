name: Refresh OWASP Mirror
run-name: "Refresh OWASP mirror (${{ github.event_name }})"

on:
    schedule: [ cron: "0 0 * * *" ]
    workflow_dispatch:

env:
  DEPENDENCY_CHECK_DATA_LOCATION: "${{ github.workspace }}/.dependency-check"
  DEPENDENCY_CHECK_CACHE_KEY_PREFIX: "linux-dependency-check-v1-"
  PAGES_BRANCH: "gh-pages"
  VULNZ_VERSION: "9.0.4"

jobs:

  update-mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - name: configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: build base GitHub Pages site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: prepare writable Pages directory
        run: |
          rm -rf site
          mkdir -p site
          cp -R _site/. site/
      - name: restore generated coverage pages
        run: |
          if git ls-remote --exit-code --heads origin "$PAGES_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$PAGES_BRANCH" --depth=1
            pages_worktree="$(mktemp -d)"
            git worktree add "$pages_worktree" "origin/$PAGES_BRANCH"
            if [ -d "$pages_worktree/coverage" ]; then
              rsync -a "$pages_worktree/coverage/" site/coverage/
            fi
            git worktree remove "$pages_worktree" --force
          fi
      - name: download vulnz mirror tool
        run: |
          curl --fail --location --silent --show-error \
            --output vulnz.jar \
            "https://github.com/jeremylong/open-vulnerability-cli/releases/download/v${VULNZ_VERSION}/vulnz-${VULNZ_VERSION}.jar"
      - id: dependency-check-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA_LOCATION }}
          key: ${{ env.DEPENDENCY_CHECK_CACHE_KEY_PREFIX }}update-${{ github.run_id }}
          restore-keys: |
            ${{ env.DEPENDENCY_CHECK_CACHE_KEY_PREFIX }}
      - name: refresh mirrored dependency-check assets
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p site/odc/nvd
          java -Xmx2g -jar ./vulnz.jar cve --cache --directory site/odc/nvd
          curl --fail --location --silent --show-error \
            --output site/odc/known_exploited_vulnerabilities.json \
            "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
          curl --fail --location --silent --show-error \
            --output site/odc/publishedSuppressions.xml \
            "https://dependency-check.github.io/DependencyCheck/suppressions/publishedSuppressions.xml"
          cat <<'EOF' > site/odc/index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>Passbird Dependency-Check Mirror</title>
            </head>
            <body>
              <h1>Passbird Dependency-Check Mirror</h1>
              <ul>
                <li><a href="./nvd/nvdcve-modified.meta">NVD modified metadata</a></li>
                <li><a href="./known_exploited_vulnerabilities.json">Known Exploited Vulnerabilities</a></li>
                <li><a href="./publishedSuppressions.xml">Hosted suppressions mirror</a></li>
              </ul>
            </body>
          </html>
          EOF
      - name: warm dependency-check cache from local mirror
        env:
          DEPENDENCY_CHECK_DATA_LOCATION: ${{ env.DEPENDENCY_CHECK_DATA_LOCATION }}
          DEPENDENCY_CHECK_NVD_DATAFEED_URL: "http://127.0.0.1:8000/odc/nvd/nvdcve-{0}.json.gz"
          DEPENDENCY_CHECK_KEV_URL: "http://127.0.0.1:8000/odc/known_exploited_vulnerabilities.json"
          DEPENDENCY_CHECK_HOSTED_SUPPRESSIONS_URL: "http://127.0.0.1:8000/odc/publishedSuppressions.xml"
          OSS_INDEX_USERNAME: ${{ secrets.OSS_INDEX_USERNAME }}
          OSS_INDEX_PASSWORD: ${{ secrets.OSS_INDEX_PASSWORD }}
        run: |
          python3 -m http.server 8000 --directory site >/tmp/odc-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --retry 10 --retry-delay 1 --silent --fail \
            "http://127.0.0.1:8000/odc/nvd/nvdcve-modified.meta" >/dev/null
          ./gradlew dependencyCheckUpdate --stacktrace
      - name: save warmed dependency-check cache
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA_LOCATION }}
          key: ${{ steps.dependency-check-cache.outputs.cache-primary-key }}
      - name: store current Pages snapshot
        run: |
          pages_worktree="$(mktemp -d)"
          git worktree add --detach "$pages_worktree"
          (
            cd "$pages_worktree"
            if git show-ref --verify --quiet "refs/remotes/origin/$PAGES_BRANCH"; then
              git checkout -B "$PAGES_BRANCH" "origin/$PAGES_BRANCH"
            else
              git checkout --orphan "$PAGES_BRANCH"
              git rm -rf . >/dev/null 2>&1 || true
            fi
          )
          rsync -a --delete site/ "$pages_worktree/"
          touch "$pages_worktree/.nojekyll"
          (
            cd "$pages_worktree"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "ci: refresh dependency-check mirror"
              git push origin HEAD:"$PAGES_BRANCH"
            fi
          )
          git worktree remove "$pages_worktree" --force
      - name: upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy-pages:
    runs-on: ubuntu-latest
    needs: update-mirror
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
