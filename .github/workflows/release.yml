name: Release
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
      timezone: Europe/Berlin
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
env:
  MISE_AUTO_INSTALL: 'false'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'
jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: node
      - run: npm ci --ignore-scripts
      - name: Plan without tagging or publishing
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: npm run release:plan

  release-readiness:
    name: Release Readiness
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      ci_run_id: ${{ steps.evidence.outputs.ci_run_id }}
      ci_attempt: ${{ steps.evidence.outputs.ci_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python
      - name: Verify exact-source CI prerequisites
        id: evidence
        run: python3 .github/scripts/check-release-ci.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release-candidate:
    name: Release Candidate
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python java node github:please-behave/cli
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Fetch candidate dependencies
        run: mise run setup:candidate
      - name: Build versioned candidate
        uses: please-behave/action@196e1d61f898e0cb77c58ab3dd6667f021321d5e # v1.3.0
        with:
          install: 'false'
          sync: 'true'
          execution-point: release
          summary: 'true'
      - name: Package verified candidate
        run: mise run package
      - name: Verify candidate archive
        run: python3 .github/scripts/release-artifacts.py verify --without-smokes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: passbird-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: release-candidate-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .please/reports/last.json
            build/reports/
            build/test-results/
            build/smoke-test-candidate-java-*/
          include-hidden-files: true
          if-no-files-found: warn

  release-smoke:
    name: Release Candidate (Java ${{ matrix.java }})
    needs: [plan, release-candidate]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    env:
      EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python java@temurin-${{ matrix.java }}
      - name: Prepare smoke desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xauth xclip xvfb
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: passbird-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Smoke exact versioned candidate
        run: mise exec java@temurin-${{ matrix.java }} -- xvfb-run -a bash .github/scripts/smoke-candidate.sh "${{ matrix.java }}"
      - name: Record release candidate evidence
        run: python3 .github/scripts/release-evidence.py record
        env:
          EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TARGET: java-${{ matrix.java }}
      - name: Upload release candidate evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}-java-${{ matrix.java }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Upload tested candidate runtime receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: passbird-smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.java }}
          path: dist/smoke/${{ matrix.java }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload smoke failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-smoke-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.java }}
          path: build/smoke-test-candidate-java-*/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish
    needs: [plan, release-readiness, release-candidate, release-smoke]
    if: >-
      needs.plan.outputs.release == 'true' &&
      needs.release-readiness.result == 'success' &&
      needs.release-candidate.result == 'success' &&
      needs.release-smoke.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_MODE: ${{ needs.plan.outputs.mode }}
      VERIFIED_CI_RUN_ID: ${{ needs.release-readiness.outputs.ci_run_id }}
      VERIFIED_CI_ATTEMPT: ${{ needs.release-readiness.outputs.ci_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python node
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: passbird-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Collect candidate runtime receipts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: passbird-smoke-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: dist/smoke
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-jar
          path: verified-release-jar
          run-id: ${{ needs.release-readiness.outputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Download release candidate evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: release-evidence
          merge-multiple: true
      - name: Verify complete release candidate evidence
        run: python3 .github/scripts/release-evidence.py verify
        env:
          EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      - name: Publish exact verified candidate without rebuilding
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: npm run release

