name: Release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: A manual run publishes a development prerelease unless an official release is chosen; the schedule always releases officially
        type: choice
        options: [prerelease, release]
        default: prerelease
      force:
        description: Release a patch version even if no commit would raise the version, to test the release process
        type: boolean
        default: false
  schedule:
    - cron: '23 3 * * 1'
      timezone: Europe/Berlin
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
env:
  MISE_AUTO_INSTALL: 'false'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'
jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: christianpflugradt/please-behave-governance/.github/workflows/release-plan.yml@95293131bd2673933aa8b97348b90486e07e431e # updates/workflows/release
    with:
      mode: ${{ github.event_name == 'schedule' && 'release' || inputs.mode }}
      tag-format: '${version}'
      force: ${{ inputs.force }}

  release-readiness:
    name: Release Readiness
    needs: plan
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: read
      actions: read
    uses: christianpflugradt/please-behave-governance/.github/workflows/release-readiness.yml@95293131bd2673933aa8b97348b90486e07e431e # updates/workflows/release
    with:
      source-sha: ${{ needs.plan.outputs.source_sha }}
      required-jobs: Check
      timeout-minutes: 90

  release-candidate:
    name: Release Candidate
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python java node github:please-behave/cli
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Fetch candidate dependencies
        run: mise run setup:candidate
      - name: Verify the candidate at the release point
        uses: christianpflugradt/please-behave-governance/actions/release/governance@e0d645d4cf3d5e462540eb184ee55b5ad7227889 # updates/actions/release
        with:
          extra-report-paths: |
            build/reports/
            build/test-results/
            build/smoke-test-candidate-java-*/
      - name: Package verified candidate
        run: mise run package
      - name: Verify candidate archive
        run: python3 .github/scripts/release-artifacts.py verify --without-smokes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: passbird-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
  release-smoke:
    name: Release Candidate (Java ${{ matrix.java }})
    needs: [plan, release-candidate]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    env:
      EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python java@temurin-${{ matrix.java }}
      - name: Prepare smoke desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xauth xclip xvfb
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: passbird-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Smoke exact versioned candidate
        run: mise exec java@temurin-${{ matrix.java }} -- xvfb-run -a sh .github/scripts/smoke-candidate.sh "${{ matrix.java }}"
      - name: Record release candidate evidence
        uses: christianpflugradt/please-behave-governance/actions/release/evidence@e0d645d4cf3d5e462540eb184ee55b5ad7227889 # updates/actions/release
        with:
          operation: record
          version: ${{ needs.plan.outputs.version }}
          target: java-${{ matrix.java }}
      - name: Upload smoke failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-smoke-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.java }}
          path: build/smoke-test-candidate-java-*/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish
    needs: [plan, release-readiness, release-candidate, release-smoke]
    if: >-
      needs.plan.outputs.release == 'true' &&
      needs.release-readiness.result == 'success' &&
      needs.release-candidate.result == 'success' &&
      needs.release-smoke.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_MODE: ${{ needs.plan.outputs.mode }}
      VERIFIED_CI_RUN_ID: ${{ needs.release-readiness.outputs.ci_run_id }}
      VERIFIED_CI_ATTEMPT: ${{ needs.release-readiness.outputs.ci_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python node
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-jar
          path: verified-release-jar
          run-id: ${{ needs.release-readiness.outputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Verify complete release candidate evidence
        uses: christianpflugradt/please-behave-governance/actions/release/evidence@e0d645d4cf3d5e462540eb184ee55b5ad7227889 # updates/actions/release
        with:
          operation: verify
          version: ${{ needs.plan.outputs.version }}
      - name: Publish exact verified candidate without rebuilding
        uses: christianpflugradt/please-behave-governance/actions/release/publish@e0d645d4cf3d5e462540eb184ee55b5ad7227889 # updates/actions/release
        with:
          version: ${{ needs.plan.outputs.version }}
          mode: ${{ needs.plan.outputs.mode }}
          tag-format: '${version}'
          force: ${{ inputs.force }}
          assets: |
            dist/passbird.jar :: Passbird executable JAR
            dist/SHA256SUMS
            dist/metadata.json
          verify-command: python3 .github/scripts/release-artifacts.py verify-ci
