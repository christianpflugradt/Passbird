name: Release
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
      timezone: Europe/Berlin
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'
jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Plan without tagging or publishing
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: npm run release:plan

  release-readiness:
    name: Release Readiness
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      ci_run_id: ${{ steps.evidence.outputs.ci_run_id }}
      ci_attempt: ${{ steps.evidence.outputs.ci_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - name: Read pinned governor version
        id: governor
        run: echo "version=$(cat .please-version)" >> "$GITHUB_OUTPUT"
      - uses: please-behave/action@722d5967c094e5ac4bfe25e9f82b020ff34e9487 # v1.2.0
        with:
          version: ${{ steps.governor.outputs.version }}
          run: 'false'
      - name: Synchronize governance
        run: please sync --yes
      - name: Verify release readiness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        uses: please-behave/action@722d5967c094e5ac4bfe25e9f82b020ff34e9487 # v1.2.0
        with:
          version: ${{ steps.governor.outputs.version }}
          execution-point: release-readiness
          checks-only: 'true'
          summary: 'true'
      - name: Read trusted CI artifact identity from the external proof
        id: evidence
        run: python3 scripts/release-artifacts.py ci-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: release-readiness-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .please/reports/last.json
          include-hidden-files: true
          if-no-files-found: warn

  release-candidate:
    name: Release Candidate
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Prepare candidate dependencies
        run: bash scripts/prepare.sh candidate
      - name: Read pinned governor version
        id: governor
        run: echo "version=$(cat .please-version)" >> "$GITHUB_OUTPUT"
      - uses: please-behave/action@722d5967c094e5ac4bfe25e9f82b020ff34e9487 # v1.2.0
        with:
          version: ${{ steps.governor.outputs.version }}
          run: 'false'
      - name: Synchronize governance
        run: please sync --yes
      - name: Build and package versioned candidate
        uses: please-behave/action@722d5967c094e5ac4bfe25e9f82b020ff34e9487 # v1.2.0
        with:
          version: ${{ steps.governor.outputs.version }}
          execution-point: release-candidate
          checks-only: 'true'
          summary: 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: passbird-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: release-candidate-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .please/reports/last.json
            build/reports/
            build/test-results/
            build/smoke-test-candidate-java-*/
          include-hidden-files: true
          if-no-files-found: warn

  release-smoke:
    name: Release Candidate (Java ${{ matrix.java }})
    needs: [plan, release-candidate]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    env:
      EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: Prepare smoke test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xauth xclip xvfb
      - name: Read pinned governor version
        id: governor
        run: echo "version=$(cat .please-version)" >> "$GITHUB_OUTPUT"
      - name: Install published governor
        uses: please-behave/action@722d5967c094e5ac4bfe25e9f82b020ff34e9487 # v1.2.0
        with:
          version: ${{ steps.governor.outputs.version }}
          run: 'false'
      - name: Synchronize governance
        run: please sync --yes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: passbird-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Smoke exact versioned candidate
        run: xvfb-run -a bash scripts/smoke-candidate.sh "${{ matrix.java }}"
      - name: Record release candidate evidence
        uses: please-behave/action@722d5967c094e5ac4bfe25e9f82b020ff34e9487 # v1.2.0
        with:
          version: ${{ steps.governor.outputs.version }}
          execution-point: release-record
          checks-only: 'true'
          summary: 'true'
        env:
          EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TARGET: java-${{ matrix.java }}
      - name: Upload release candidate evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}-java-${{ matrix.java }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Upload tested candidate runtime receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: passbird-smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.java }}
          path: dist/smoke/${{ matrix.java }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload smoke failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-smoke-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.java }}
          path: build/smoke-test-candidate-java-*/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish
    needs: [plan, release-readiness, release-candidate, release-smoke]
    if: >-
      needs.plan.outputs.release == 'true' &&
      needs.release-readiness.result == 'success' &&
      needs.release-candidate.result == 'success' &&
      needs.release-smoke.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_MODE: ${{ needs.plan.outputs.mode }}
      VERIFIED_CI_RUN_ID: ${{ needs.release-readiness.outputs.ci_run_id }}
      VERIFIED_CI_ATTEMPT: ${{ needs.release-readiness.outputs.ci_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: passbird-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Collect candidate runtime receipts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: passbird-smoke-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: dist/smoke
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-jar
          path: verified-release-jar
          run-id: ${{ needs.release-readiness.outputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Read pinned governor version
        id: governor
        run: echo "version=$(cat .please-version)" >> "$GITHUB_OUTPUT"
      - name: Install published governor
        uses: please-behave/action@722d5967c094e5ac4bfe25e9f82b020ff34e9487 # v1.2.0
        with:
          version: ${{ steps.governor.outputs.version }}
          run: 'false'
      - name: Synchronize governance
        run: please sync --yes
      - name: Download release candidate evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: release-evidence
          merge-multiple: true
      - name: Verify complete release candidate evidence
        uses: please-behave/action@722d5967c094e5ac4bfe25e9f82b020ff34e9487 # v1.2.0
        with:
          version: ${{ steps.governor.outputs.version }}
          execution-point: release-verify
          checks-only: 'true'
          summary: 'true'
        env:
          EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      - name: Publish exact verified candidate without rebuilding
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: npm run release
