name: Release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: A manual run publishes a development prerelease unless an official release is chosen; the schedule always releases officially
        type: choice
        options: [prerelease, release]
        default: prerelease
      force:
        description: Release a patch version even if no commit would raise the version, to test the release process
        type: boolean
        default: false
  schedule:
    - cron: '23 3 * * 1'
      timezone: Europe/Berlin
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
env:
  MISE_AUTO_INSTALL: 'false'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'
jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: christianpflugradt/repository-catalog/.github/workflows/release-plan.yml@0f47bb84ff5435cb6b692275fb6767f4f599abdb # updates/workflows/release
    with:
      mode: ${{ github.event_name == 'schedule' && 'release' || inputs.mode }}
      tag-format: '${version}'
      force: ${{ inputs.force }}

  release-readiness:
    name: Release Readiness
    needs: plan
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: read
      actions: read
    uses: christianpflugradt/repository-catalog/.github/workflows/release-readiness.yml@0f47bb84ff5435cb6b692275fb6767f4f599abdb # updates/workflows/release
    with:
      source-sha: ${{ needs.plan.outputs.source_sha }}
      required-jobs: check / Check

  release-candidate:
    name: Release Candidate (Java ${{ matrix.java }})
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    env:
      EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      MISE_JAVA_VERSION: temurin-${{ matrix.java }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python java@temurin-${{ matrix.java }} node github:please-behave/cli
          experimental: true
          version: 2026.11.11
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Prepare smoke desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xauth xclip xvfb
      - name: Fetch candidate dependencies
        run: mise run setup:candidate
      - name: Verify the candidate at the release point
        uses: christianpflugradt/repository-catalog/actions/release/governance@0f47bb84ff5435cb6b692275fb6767f4f599abdb # updates/actions/release
      - name: Verify the version of the JAR
        run: sh .github/scripts/verify-release-jar-manifest.sh build/libs/passbird.jar "$EXPECTED_RELEASE_VERSION"
      - name: Smoke the candidate on this Java version
        run: mise exec -- xvfb-run -a sh smoke-test/run.sh
        env:
          PASSBIRD_SMOKE_TMPDIR: ${{ github.workspace }}/build/smoke-test-candidate-java-${{ matrix.java }}
          PASSBIRD_SMOKE_KEEP_TMP: '1'
      - name: Stage the JAR that is published
        if: matrix.java == '17'
        run: mkdir dist && cp build/libs/passbird.jar dist/
      - name: Record release candidate evidence
        if: matrix.java == '17'
        uses: christianpflugradt/repository-catalog/actions/release/evidence@0f47bb84ff5435cb6b692275fb6767f4f599abdb # updates/actions/release
        with:
          operation: record
          version: ${{ needs.plan.outputs.version }}
          target: java-17
      - name: Upload smoke failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-smoke-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.java }}
          path: build/smoke-test-candidate-java-*/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish
    needs: [plan, release-readiness, release-candidate]
    if: >-
      needs.plan.outputs.release == 'true' &&
      needs.release-readiness.result == 'success' &&
      needs.release-candidate.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python node
          experimental: true
          version: 2026.11.11
      - name: Verify complete release candidate evidence
        uses: christianpflugradt/repository-catalog/actions/release/evidence@0f47bb84ff5435cb6b692275fb6767f4f599abdb # updates/actions/release
        with:
          operation: verify
          version: ${{ needs.plan.outputs.version }}
      - name: Checksum the JAR
        working-directory: dist
        run: sha256sum -- passbird.jar > SHA256SUMS
      - name: Publish exact verified candidate without rebuilding
        uses: christianpflugradt/repository-catalog/actions/release/publish-release@0f47bb84ff5435cb6b692275fb6767f4f599abdb # updates/actions/release
        with:
          version: ${{ needs.plan.outputs.version }}
          mode: ${{ needs.plan.outputs.mode }}
          tag-format: '${version}'
          force: ${{ inputs.force }}
          assets: |
            dist/passbird.jar
            dist/SHA256SUMS
